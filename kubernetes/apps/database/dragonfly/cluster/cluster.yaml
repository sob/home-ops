---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v1.40.2@sha256:18afa43e911f1dff18c7d1eb452361876d9702bb1cdff5c5d75c69617a4065c9
  replicas: 4 # set to the number of nodes in the cluster
  # No networkPolicyEnabled: operator v1.7.0 removed operator-managed
  # NetworkPolicies and the field with them, and the CRD now rejects it
  # (it blocked this Kustomization, and authentik behind it, from 2026-09-28).
  # If a policy is ever wanted, write one: it must admit every consuming
  # namespace on 6379 and the operator's real labels on admin port 9999.
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --default_lua_flags=allow-undeclared-keys
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 512Mi

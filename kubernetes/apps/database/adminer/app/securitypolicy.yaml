---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Tinyauth forward-auth (Envoy ext-auth); access is the "adminer" entry in
# Tinyauth's config (security/tinyauth/app/externalsecret.yaml).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: adminer
  namespace: database
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: adminer
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - cookie
      - accept
      - user-agent
      - authorization
      - x-forwarded-for
      - x-forwarded-proto
      - x-real-ip
    http:
      backendRefs:
        - kind: Service
          name: tinyauth
          namespace: security
          port: 8082
      path: /api/auth/envoy?path=
      headersToBackend:
        - Remote-User
        - Remote-Name
        - Remote-Email
        - Remote-Groups
        - Remote-Sub

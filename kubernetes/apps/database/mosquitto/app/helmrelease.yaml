---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mosquitto
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      mosquitto:
        # Restart only for mosquitto.conf/acl changes. New or changed users in
        # mosquitto-secret are picked up by the passwd-sync sidecar with a SIGHUP,
        # so adding a bridge doesn't disconnect every client or drop retained state.
        annotations:
          configmap.reloader.stakater.com/reload: mosquitto-config
        pod:
          # passwd-sync signals the broker process
          shareProcessNamespace: true
          securityContext:
            runAsUser: 1883
            runAsGroup: 1883
            runAsNonRoot: true
            fsGroup: 1883
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-passwords:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22
            command: ["/bin/sh", "/scripts/passwd.sh"]
        containers:
          passwd-sync:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22
            command: ["/bin/sh", "-c"]
            args:
              - |
                # The kubelet refreshes /secret within a minute or two of the
                # ExternalSecret changing; rebuild the password file and SIGHUP the
                # broker, which reloads password_file without dropping clients.
                last=$(cat /secret/*_USER /secret/*_PASS | sha256sum)
                while true; do
                  sleep 30
                  sum=$(cat /secret/*_USER /secret/*_PASS | sha256sum)
                  [ "$sum" = "$last" ] && continue
                  if sh /scripts/passwd.sh && kill -HUP "$(pidof mosquitto)"; then
                    echo "reloaded mosquitto users"
                    last=$sum
                  fi
                done
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 1m
                memory: 8Mi
              limits:
                memory: 32Mi
          app:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "mqtt.${SECRET_DOMAIN}"
        ports:
          mqtt:
            port: 1883
            protocol: TCP
    persistence:
      config:
        type: configMap
        name: mosquitto-config
        advancedMounts:
          mosquitto:
            app:
              - path: /mosquitto/config
                readOnly: true
            init-passwords: &scripts
              - path: /scripts
                readOnly: true
            passwd-sync: *scripts
      # Mounted as files (not env) so passwd-sync sees updates without a restart.
      secret:
        type: secret
        name: mosquitto-secret
        advancedMounts:
          mosquitto:
            init-passwords: &secret
              - path: /secret
                readOnly: true
            passwd-sync: *secret
      passwd:
        type: emptyDir
        globalMounts:
          - path: /mosquitto-init
      # mosquitto_passwd writes a temp file; passwd-sync's root filesystem is read-only.
      tmp:
        type: emptyDir
        advancedMounts:
          mosquitto:
            passwd-sync:
              - path: /tmp
      # Persistence only holds retained messages and sessions (47 bytes when
      # this moved off Ceph); publishers re-announce, so an emptyDir is enough.
      data:
        type: emptyDir
        sizeLimit: 256Mi
        globalMounts:
          - path: /mosquitto/data

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mosquitto-secret
    template:
      engineVersion: v2
      data:
        # Every <NAME>_USER / <NAME>_PASS pair becomes a Mosquitto user (config/passwd.sh).
        # Adding one reloads the password file in place; Mosquitto does not restart.
        HASS_USER: "{{ .MQTT_HASS_USERNAME }}"
        HASS_PASS: "{{ .MQTT_HASS_PASSWORD }}"
        RATGDO_USER: "{{ .MQTT_RATGDO_USERNAME }}"
        RATGDO_PASS: "{{ .MQTT_RATGDO_PASSWORD }}"
        ZIGBEE_USER: "{{ .MQTT_ZIGBEE_USERNAME }}"
        ZIGBEE_PASS: "{{ .MQTT_ZIGBEE_PASSWORD }}"
        EXPORTER_USER: "{{ .MQTT_EXPORTER_USERNAME }}"
        EXPORTER_PASS: "{{ .MQTT_EXPORTER_PASSWORD }}"
        RTLAMR_USER: "{{ .MQTT_RTLAMR2MQTT_USERNAME }}"
        RTLAMR_PASS: "{{ .MQTT_RTLAMR2MQTT_PASSWORD }}"
        N8N_USER: "{{ .MQTT_N8N_USERNAME }}"
        N8N_PASS: "{{ .MQTT_N8N_PASSWORD }}"
        NODERED_USER: "{{ .MQTT_NODERED_USERNAME }}"
        NODERED_PASS: "{{ .MQTT_NODERED_PASSWORD }}"
        BATOCERA_USER: "{{ .MQTT_BATOCERA_USERNAME }}"
        BATOCERA_PASS: "{{ .MQTT_BATOCERA_PASSWORD }}"
        # home-bridges keep their login in their own item (hue-mqtt, ...)
        HUE_USER: "{{ .MQTT_HUE_USERNAME }}"
        HUE_PASS: "{{ .MQTT_HUE_PASSWORD }}"
        UINETWORK_USER: "{{ .MQTT_UINETWORK_USERNAME }}"
        UINETWORK_PASS: "{{ .MQTT_UINETWORK_PASSWORD }}"
        ECOBEE_USER: "{{ .MQTT_ECOBEE_USERNAME }}"
        ECOBEE_PASS: "{{ .MQTT_ECOBEE_PASSWORD }}"
        AUGUST_USER: "{{ .MQTT_AUGUST_USERNAME }}"
        AUGUST_PASS: "{{ .MQTT_AUGUST_PASSWORD }}"
        DENON_USER: "{{ .MQTT_DENON_USERNAME }}"
        DENON_PASS: "{{ .MQTT_DENON_PASSWORD }}"
        EPSON_USER: "{{ .MQTT_EPSON_USERNAME }}"
        EPSON_PASS: "{{ .MQTT_EPSON_PASSWORD }}"
        MEDIA_USER: "{{ .MQTT_MEDIA_USERNAME }}"
        MEDIA_PASS: "{{ .MQTT_MEDIA_PASSWORD }}"
        RACHIO_USER: "{{ .MQTT_RACHIO_USERNAME }}"
        RACHIO_PASS: "{{ .MQTT_RACHIO_PASSWORD }}"
        FLAIR_USER: "{{ .MQTT_FLAIR_USERNAME }}"
        FLAIR_PASS: "{{ .MQTT_FLAIR_PASSWORD }}"
        SMARTTUB_USER: "{{ .MQTT_SMARTTUB_USERNAME }}"
        SMARTTUB_PASS: "{{ .MQTT_SMARTTUB_PASSWORD }}"
        WEATHERFLOW_USER: "{{ .MQTT_WEATHERFLOW_USERNAME }}"
        WEATHERFLOW_PASS: "{{ .MQTT_WEATHERFLOW_PASSWORD }}"
        SONOS_USER: "{{ .MQTT_SONOS_USERNAME }}"
        SONOS_PASS: "{{ .MQTT_SONOS_PASSWORD }}"
        LUTRON_USER: "{{ .MQTT_LUTRON_USERNAME }}"
        LUTRON_PASS: "{{ .MQTT_LUTRON_PASSWORD }}"
        RING_USER: "{{ .MQTT_RING_USERNAME }}"
        RING_PASS: "{{ .MQTT_RING_PASSWORD }}"
        UIPROTECT_USER: "{{ .MQTT_UIPROTECT_USERNAME }}"
        UIPROTECT_PASS: "{{ .MQTT_UIPROTECT_PASSWORD }}"
        SHELLY_USER: "{{ .MQTT_SHELLY_USERNAME }}"
        SHELLY_PASS: "{{ .MQTT_SHELLY_PASSWORD }}"
  dataFrom:
    - extract:
        key: mqtt
    - extract:
        key: uiprotect-mqtt
    - extract:
        key: hue-mqtt
    - extract:
        key: uinetwork-mqtt
    - extract:
        key: ecobee-mqtt
    - extract:
        key: august-mqtt
    - extract:
        key: denon-mqtt
    - extract:
        key: epson-mqtt
    - extract:
        key: media-mqtt
    - extract:
        key: rachio-mqtt
    - extract:
        key: flair-mqtt
    - extract:
        key: smarttub
    - extract:
        key: weatherflow-mqtt
    - extract:
        key: sonos-mqtt
    - extract:
        key: lutron-mqtt
    - extract:
        key: ring-mqtt
    - extract:
        key: shelly-mqtt

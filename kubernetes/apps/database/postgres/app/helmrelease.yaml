---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postgres
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      # Shared instance. Every consuming app gets its own database and role
      # inside it, created idempotently by the init-db initContainer that
      # components/postgresql injects — not its own postgres.
      postgres:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/postgres
              tag: 18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
            env:
              TZ: America/Chicago
              POSTGRES_USER: postgres
              POSTGRES_DB: postgres
              # MUST be a subdirectory of the mount, not the mount root:
              # initdb refuses to run in a non-empty directory and an
              # RBD/ext4 volume always has lost+found at its root. Also note
              # the 18 images changed the default to /var/lib/postgresql/18/
              # docker, so leaving this unset would put the data somewhere
              # that is not on the PVC at all.
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - secretRef:
                  name: postgres-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # initdb on first boot, and WAL replay after an unclean stop,
                  # are slow on ceph-block. 30 x 10s = 5 minutes before the
                  # liveness probe is allowed to start killing the container.
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi

      # Logical dumps, for the restore case the physical snapshot handles badly:
      # "put lubelog's database back" without rolling the whole volume — and
      # every other app on this instance — back with it.
      #
      # Dumped per-database (plus globals) rather than as one pg_dumpall
      # archive, because a pg_dumpall restores the entire cluster or nothing —
      # which would defeat the only reason these dumps exist.
      dump:
        type: cronjob
        cronjob:
          schedule: "15 0 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 2
        pod:
          # Writes into the same RWO PVC postgres is using. RWO permits many
          # pods on ONE node, so this must land on postgres's node or the mount
          # fails. (ReadWriteOncePod would forbid this outright; RWO does not.)
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/controller: postgres
          restartPolicy: OnFailure
        containers:
          app:
            image:
              repository: docker.io/library/postgres
              tag: 18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
            env:
              TZ: America/Chicago
            envFrom:
              - secretRef:
                  name: postgres-secret
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                HOST=postgres.database.svc.cluster.local
                DIR=/var/lib/postgresql/data/dumps
                DEST="$DIR/$(date +%Y%m%d-%H%M%S)"
                mkdir -p "$DEST"

                # Globals (roles, grants, tablespaces) are NOT included in a
                # per-database dump, so they are captured separately.
                pg_dumpall -h "$HOST" -U postgres --globals-only \
                  | gzip -9 > "$DEST/globals.sql.gz.tmp"
                mv "$DEST/globals.sql.gz.tmp" "$DEST/globals.sql.gz"

                # One custom-format dump per database. This is the whole point:
                # a single app can be put back with
                #   pg_restore -h HOST -U postgres -d <db> --clean <db>.dump
                # without replaying, and therefore rolling back, every other
                # app sharing this instance. A pg_dumpall archive cannot do
                # that — it restores the entire cluster or nothing.
                for DB in $(psql -h "$HOST" -U postgres -tAc \
                    "select datname from pg_database where not datistemplate and datallowconn order by 1"); do
                  # -Fc writes to a file directly, so write to .tmp and rename:
                  # an interrupted dump must never look like a usable backup.
                  pg_dump -h "$HOST" -U postgres -Fc -d "$DB" -f "$DEST/$DB.dump.tmp"
                  mv "$DEST/$DB.dump.tmp" "$DEST/$DB.dump"
                  echo "  $DB -> $(stat -c %s "$DEST/$DB.dump") bytes"
                done

                # Retain 7 dated directories. volsync keeps 7 daily snapshots of
                # this volume, so R2 holds roughly a week either way.
                ls -1d "$DIR"/*/ 2>/dev/null | sort -r | tail -n +8 | xargs -r rm -rf
                echo "wrote $DEST"
                echo "retained: $(ls -1d "$DIR"/*/ 2>/dev/null | wc -l) dump set(s)"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: postgres
        ports:
          postgres:
            port: 5432

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/postgresql/data
      # readOnlyRootFilesystem means the unix socket directory and scratch
      # space both have to be writable mounts.
      run:
        type: emptyDir
        globalMounts:
          - path: /var/run/postgresql
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-linux-slim
spec:
  chartRef:
    kind: OCIRepository
    name: arc-linux-slim
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Second org-level scale set for github.com/doorgames-io, alongside `arc-linux`.
    # Same org, same GitHub App installation — this exists purely so non-Android
    # jobs stop landing on the ~1.4GB Android image with its 1500m/3Gi request.
    # Workflows target it with:
    #   runs-on: arc-linux-slim
    githubConfigUrl: https://github.com/doorgames-io
    githubConfigSecret: arc-github-app-slim
    # MUST be unique across the namespace, not just across GitHub scopes: the chart
    # names the AutoscalingRunnerSet and the `<name>-gha-rs-manager` Role/RoleBinding
    # after runnerScaleSetName (NOT the Helm release name), so reusing `arc-linux`
    # here would collide head-on with the existing scale set.
    runnerScaleSetName: arc-linux-slim
    runnerGroup: default
    # See ../../runners/app for why this is spelled out rather than discovered:
    # the chart otherwise looks up the live controller Deployment at template time
    # (fails under `helm template` in flux-local CI), and a wrong name binds the
    # namespace manager Role to a phantom SA — jobs then silently stop dispatching.
    #   kubectl -n actions-runner-system get sa | grep controller
    controllerServiceAccount:
      namespace: actions-runner-system
      name: gha-runner-scale-set-controller-gha-rs-controller
    # No warm runner: these jobs are cheap and infrequent, and a ~30s cold start
    # beats parking a pod on a node all day. maxRunners is capped at 3 because
    # every runner now prefers the same node (see affinity below), at up to 6Gi each.
    minRunners: 0
    maxRunners: 3
    # dind, matching arc-linux: in kubernetes container mode every job MUST declare
    # a `container:`, and jobs that run steps directly on the runner are rejected.
    template:
      spec:
        # CI is single-core-bound and every other node is an i3-7100U (2C/4T,
        # 2.4GHz, no turbo) — measured ~2x slower than ubuntu-latest per core.
        # metal-07 (Raptor Lake, 16 threads) roughly doubles that. Tolerate its
        # media taint rather than removing it, so only CI follows it there.
        # Preferred, not required: if metal-07 is down or full, jobs still run
        # on an i3 node, slowly, instead of sitting Pending.
        # Note jest/vitest size worker pools from host cores (16 here), not from
        # the cgroup — homeboy caps maxWorkers on CI to stay inside the limit.
        tolerations:
          - key: workload-type
            operator: Equal
            value: media
            effect: NoSchedule
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["metal-07"]
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["/home/runner/run.sh"]
            # Stock runner, no Android SDK, so the floor is well under arc-linux's
            # 1500m/3Gi — but NOT a token request. Measured on the cluster: the
            # request is what sets cgroup v2 `cpu.weight`, and nothing here caps
            # CPU at all (`cpu.max = max`, no LimitRange). At 250m the runner got
            # weight 10 against arc-linux's 59, so a test job co-scheduled with an
            # Android build was starved ~6:1 — fast on an idle node, slow on a busy
            # one, which reads as flaky tests rather than as a slow machine.
            # 2000m holds its own against Plex/Jellyfin on metal-07 and 3 runners
            # still fit its 16 cores.
            # Deliberately no CPU limit: a ceiling would throttle bursty compile
            # phases, which is the opposite of what these jobs need.
            # 6Gi: at 2Gi the pod sat at memory.max (6432 `max` events in one run)
            # with integration shards running serially; homeboy now runs 4 shards
            # in parallel (~650MB each) and 4 jsdom/jest-expo workers.
            resources:
              requests:
                cpu: 2000m
                memory: 2Gi
              limits:
                memory: 6Gi
    containerMode:
      type: dind

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app-slim
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: arc-github-app-slim
    template:
      engineVersion: v2
      data:
        github_app_id: "{{ .GITHUB_APP_ID }}"
        github_app_installation_id: "{{ .GITHUB_APP_INSTALLATION_ID }}"
        github_app_private_key: "{{ .GITHUB_APP_PRIVATE_KEY }}"
  dataFrom:
    # Same GitHub App and the same org installation as the arc-linux scale set —
    # this is a second Secret from one 1Password item, not a second credential.
    # Materialised separately (rather than reusing the `arc-github-app` Secret
    # owned by ../../runners/app) so this Kustomization owns everything it needs
    # and a change over there can't prune the Secret out from under it.
    - extract:
        key: actions-runner-controller

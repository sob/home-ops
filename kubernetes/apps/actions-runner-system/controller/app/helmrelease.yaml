---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-controller
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
  interval: 30m
  # Flux defaults upgrade.crds to Skip, which left the CRDs on 0.14 when the chart
  # went to 0.15 — the 0.15 scale-set chart always renders spec.listenerConfig, so
  # creating an AutoscalingRunnerSet then fails "field not declared in schema".
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # One controller reconciles every AutoscalingRunnerSet in the cluster.
    replicaCount: 1
    flags:
      logLevel: info
      logFormat: text
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

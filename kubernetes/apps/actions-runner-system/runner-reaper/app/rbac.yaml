---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-reaper
---
# Only runner pods and EphemeralRunners in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-reaper
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-reaper
subjects:
  - kind: ServiceAccount
    name: runner-reaper
    namespace: actions-runner-system
---
# Read-only node status, to tell which nodes are dead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runner-reaper
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runner-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runner-reaper
subjects:
  - kind: ServiceAccount
    name: runner-reaper
    namespace: actions-runner-system

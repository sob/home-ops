---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synology-cert
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: synology-cert-secret
    template:
      engineVersion: v2
      data:
        # A dedicated DSM administrator (importing certificates needs admin)
        # with no 2FA, used only by this job.
        DSM_USER: "{{ .username }}"
        DSM_PASS: "{{ .credential }}"
  dataFrom:
    - extract:
        key: synology-cert-deploy

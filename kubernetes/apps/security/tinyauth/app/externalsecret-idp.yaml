---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tinyauth-idp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: tinyauth-idp-secret
    template:
      engineVersion: v2
      data:
        # The whole config is rendered here so nothing identifying is committed:
        # users are USER1..USER8 in the tinyauth 1Password item, and who is who
        # lives only there. Only users listed here can sign in through the
        # bridge, however they authenticated upstream.
        config.yaml: |
          # Sidecar in the tinyauth pod: 8080 is the branding proxy.
          listen: ":8081"
          publicUrl: https://login.56kbps.io/idp
          client:
            id: tinyauth
            secret: "{{ .BRIDGE_CLIENT_SECRET }}"
            # One per Tinyauth provider (separate Plex / Apple buttons); exact match.
            redirectUris:
              - https://login.56kbps.io/api/oauth/callback/plex
              - https://login.56kbps.io/api/oauth/callback/apple
              - https://login.56kbps.io/api/oauth/callback/google-sso
          plex:
            clientIdentifier: "{{ .PLEX_CLIENT_ID }}"
            product: "56kbps"
            serverMachineIdentifier: "{{ .PLEX_SERVER_ID }}"
          google:
            clientId: "{{ .GOOGLE_CLIENT_ID }}"
            clientSecret: "{{ .GOOGLE_CLIENT_SECRET }}"
          apple:
            consumerKey: "{{ .APPLE_CONSUMER_KEY }}"
            privateKey: |
          {{ .APPLE_PRIVATE_KEY_B64 | b64dec | trim | indent 4 }}
          # Everyone gets media; users list only what they have beyond it.
          defaultGroups: [media]
          users:
            - {id: "{{ .USER1_USERNAME }}", email: "{{ .USER1_EMAIL }}", name: {{ index . "USER1_NAME" | default "" | toJson }}, groups: [admins, home, media-download, network, observability, bbs, bbs-sysop]}
            - {id: "{{ .USER2_USERNAME }}", email: "{{ .USER2_EMAIL }}", name: {{ index . "USER2_NAME" | default "" | toJson }}}
            - {id: "{{ .USER3_USERNAME }}", email: "{{ .USER3_EMAIL }}", name: {{ index . "USER3_NAME" | default "" | toJson }}}
            - {id: "{{ .USER4_USERNAME }}", email: "{{ .USER4_EMAIL }}", name: {{ index . "USER4_NAME" | default "" | toJson }}, groups: [home, media-download]}
            - {id: "{{ .USER5_USERNAME }}", email: "{{ .USER5_EMAIL }}", name: {{ index . "USER5_NAME" | default "" | toJson }}}
            - {id: "{{ .USER6_USERNAME }}", email: "{{ .USER6_EMAIL }}", name: {{ index . "USER6_NAME" | default "" | toJson }}}
            - {id: "{{ .USER7_USERNAME }}", email: "{{ .USER7_EMAIL }}", name: {{ index . "USER7_NAME" | default "" | toJson }}}
            - {id: "{{ .USER8_USERNAME }}", email: "{{ .USER8_EMAIL }}", name: {{ index . "USER8_NAME" | default "" | toJson }}}
  # Everything comes from the tinyauth item, so the bridge doesn't depend on
  # authentik's secrets (or their AUTHENTIK_BLUEPRINTS_* names).
  dataFrom:
    - extract:
        key: tinyauth

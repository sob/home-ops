---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./externalsecret-idp.yaml
  - ./referencegrant.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: tinyauth-brand
    files:
      - ./resources/nginx.conf
      - ./resources/brand.js
      - ./resources/brand.css
      - ./resources/apps.json
      - ./resources/launcher.html
generatorOptions:
  disableNameSuffixHash: true

# Sidecar in front of Tinyauth: brands the login page (:8080) and adapts
# Envoy ext-auth checks to Tinyauth's forward-auth mode (:8082).
# Note: no dollar-brace sequences anywhere in this file or brand.js; Flux
# postBuild substitution would rewrite them.
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

  # /_brand/can?host=: a bare lowercase hostname, nothing else.
  map $arg_host $ta_can_host {
    default "";
    "~^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $arg_host;
  }

  # The original request URI, exactly as Envoy appended it to the check path
  # (/api/auth/envoy?path=<original path and query>). Everything after the
  # first "path=" is taken verbatim, so the original query can't add or hide
  # a path parameter.
  map $request_uri $ta_original_uri {
    default "";
    "~^/api/auth/envoy\?path=(?<u>/.*)$" $u;
  }

  # Envoy ext-auth endpoint, reached only through the tinyauth Service's authz
  # port (never routed by the gateway).
  #
  # Tinyauth's own Envoy mode reads the path with a query-string parser that
  # silently drops any pair containing ";". A request for
  #   /auth/login_flow?x=;&path=/api
  # was checked as /api (allowed) while the app received /auth/login_flow,
  # bypassing every app's path rules (verified against v5.2.0). Forward-auth
  # mode takes the URI from X-Forwarded-Uri instead, which we set from the raw
  # request URI above; it also keeps every query parameter in the post-login
  # redirect, which the Envoy mode truncated at the first "&".
  server {
    listen 8082;

    location = /api/auth/envoy {
      if ($ta_original_uri = "") {
        return 403;
      }
      rewrite ^ /api/auth/traefik? break;
      proxy_pass http://127.0.0.1:3000;
      proxy_redirect off;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $ta_original_uri;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 8080;

    # Served from the ConfigMap; cached briefly so icon updates show quickly.
    location = /_brand/brand.js {
      alias /brand/brand.js;
      default_type application/javascript;
      add_header Cache-Control "public, max-age=300";
    }

    # App launcher catalogue (no PII: names, URLs, icons).
    location = /_brand/apps.json {
      alias /brand/apps.json;
      default_type application/json;
      add_header Cache-Control "public, max-age=300";
    }

    # Would Tinyauth let this browser's session into ?host=? The launcher
    # asks once per app, so what it shows is exactly Tinyauth's access rules
    # (204 yes; 401/403 no). The subrequest is forward-auth for that host,
    # with a non-browser User-Agent so a "no" is a 401/403, never a redirect.
    location = /_brand/can {
      if ($ta_can_host = "") {
        return 400;
      }
      auth_request /_tinyauth_can;
      add_header Cache-Control "no-store" always;
      # Answer in the content phase, after auth_request. A "return" here
      # would run in the rewrite phase, before the access check, and say yes
      # to everyone.
      try_files /nonexistent =204;
    }

    location = /_tinyauth_can {
      internal;
      proxy_pass http://127.0.0.1:3000/api/auth/traefik;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header User-Agent "tinyauth-launcher";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $ta_can_host;
      proxy_set_header X-Forwarded-Uri /;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_brand/brand.css {
      alias /brand/brand.css;
      default_type text/css;
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-Host $host;
      # sub_filter needs an uncompressed body to rewrite.
      proxy_set_header Accept-Encoding "";
      sub_filter_once on;
      sub_filter "</head>" "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\"><link rel=\"stylesheet\" href=\"/_brand/brand.css\"><script src=\"/_brand/brand.js\" defer></script></head>";
    }
  }
}

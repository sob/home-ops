# Branding sidecar for Tinyauth's login page. Only the browser-facing route
# comes through here; forward-auth checks call Tinyauth on :3000 directly.
# Note: no dollar-brace sequences anywhere in this file or brand.js; Flux
# postBuild substitution would rewrite them.
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

  server {
    listen 8080;

    # Served from the ConfigMap; cached briefly so icon updates show quickly.
    location = /_brand/brand.js {
      alias /brand/brand.js;
      default_type application/javascript;
      add_header Cache-Control "public, max-age=300";
    }

    location = /_brand/brand.css {
      alias /brand/brand.css;
      default_type text/css;
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_set_header X-Forwarded-Host $host;
      # sub_filter needs an uncompressed body to rewrite.
      proxy_set_header Accept-Encoding "";
      sub_filter_once on;
      sub_filter "</head>" "<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\"><link rel=\"stylesheet\" href=\"/_brand/brand.css\"><script src=\"/_brand/brand.js\" defer></script></head>";
    }
  }
}

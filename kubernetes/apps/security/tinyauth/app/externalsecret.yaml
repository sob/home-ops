---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tinyauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: tinyauth-secret
    template:
      engineVersion: v2
      data:
        # Tinyauth reads one config source only: with TINYAUTH_CONFIGFILE set,
        # every TINYAUTH_* env var is ignored. So the whole file is rendered
        # here, and anything identifying stays in the tinyauth 1Password item.
        config.yaml: |
          appUrl: https://auth.56kbps.io
          # ACLs are config, not Ingress labels (HTTPRoutes aren't watched), and
          # auto-detection otherwise tries the Kubernetes provider without RBAC.
          labelProvider: none
          database:
            driver: sqlite
            path: /data/tinyauth.db
          analytics:
            enabled: false
          resources:
            enabled: false
          server:
            port: 3000
            address: 0.0.0.0
          auth:
            usersFile: /secrets/users
            secureCookie: true
            sessionExpiry: 604800      # 7 days
            sessionMaxLifetime: 604800
            loginTimeout: 300
            loginMaxRetries: 5
            trustedProxies: [10.42.0.0/16]  # pod CIDR: the Envoy gateways
            acls:
              # Deny by default: a host with no apps entry is refused, and
              # every app must set both users.allow and oauth.groups (an app
              # without oauth.groups admits any OAuth user, even under deny).
              policy: deny
          oauth:
            providers:
              bridge:
                name: Plex / Apple
                clientId: tinyauth
                clientSecretFile: /secrets/bridge-client-secret
                authUrl: https://login.56kbps.io/authorize
                tokenUrl: http://tinyauth-bridge.security.svc.cluster.local:8080/token
                userinfoUrl: http://tinyauth-bridge.security.svc.cluster.local:8080/userinfo
                redirectUrl: https://auth.56kbps.io/api/oauth/callback/bridge
                scopes: [openid, email, profile, groups]
                # Required, not optional: with acls.policy deny, an EMPTY
                # whitelist abstains and the abstention becomes a denial
                # (IsEmailWhitelisted). Mirrors the bridge's own allowlist.
                whitelist:
                  - "{{ .USER1_EMAIL }}"
                  - "{{ .USER2_EMAIL }}"
                  - "{{ .USER3_EMAIL }}"
                  - "{{ .USER4_EMAIL }}"
                  - "{{ .USER5_EMAIL }}"
                  - "{{ .USER6_EMAIL }}"
                  - "{{ .USER7_EMAIL }}"
                  - "{{ .USER8_EMAIL }}"
          ui:
            title: 56kbps
        # Break-glass local login: username:bcrypt:totp. The hash was generated
        # once from the existing password, so this file only changes when the
        # 1Password fields do.
        users: "{{ .USER1_USERNAME }}:{{ .BREAKGLASS_BCRYPT }}:{{ .BREAKGLASS_TOTP }}"
        bridge-client-secret: "{{ .BRIDGE_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: tinyauth

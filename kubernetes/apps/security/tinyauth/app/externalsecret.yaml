---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tinyauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: tinyauth-secret
    template:
      engineVersion: v2
      data:
        # Tinyauth reads one config source only: with TINYAUTH_CONFIGFILE set,
        # every TINYAUTH_* env var is ignored. So the whole file is rendered
        # here, and anything identifying stays in the tinyauth 1Password item.
        config.yaml: |
          appUrl: https://login.56kbps.io
          # ACLs are config, not Ingress labels (HTTPRoutes aren't watched), and
          # auto-detection otherwise tries the Kubernetes provider without RBAC.
          labelProvider: none
          database:
            driver: sqlite
            path: /data/tinyauth.db
          analytics:
            enabled: false
          resources:
            enabled: false
          server:
            port: 3000
            address: 0.0.0.0
          auth:
            usersFile: /secrets/users
            # Local users have no email or name in the users file, so Tinyauth would
            # invent "<username>@<cookie domain>" and a capitalised username. Give
            # break-glass the same identity as USER1, so OIDC apps that match
            # accounts by email land on the same account however you sign in.
            # USERn_NAME is optional; without it the name falls back as before.
            userAttributes:
              "{{ .USER1_USERNAME }}":
                email: "{{ .USER1_EMAIL }}"
                name: {{ index . "USER1_NAME" | default "" | toJson }}
            secureCookie: true
            sessionExpiry: 604800      # 7 days
            sessionMaxLifetime: 604800
            loginTimeout: 300
            loginMaxRetries: 5
            # Pod CIDR (the Envoy gateways) and the branding sidecar on localhost,
            # so the real client IP comes from X-Forwarded-For.
            trustedProxies: [10.42.0.0/16, 127.0.0.1/32]
            acls:
              # Deny by default: a host with no apps entry is refused, and
              # every app must set both users.allow and oauth.groups (an app
              # without oauth.groups admits any OAuth user, even under deny).
              policy: deny
          oauth:
            providers:
              # One provider per upstream, so the login page shows a separate
              # button for each; provider= makes the bridge skip its chooser.
              plex:
                name: Plex
                clientId: tinyauth
                clientSecretFile: /secrets/bridge-client-secret
                authUrl: https://login.56kbps.io/idp/authorize?provider=plex
                tokenUrl: http://127.0.0.1:8081/idp/token
                userinfoUrl: http://127.0.0.1:8081/idp/userinfo
                redirectUrl: https://login.56kbps.io/api/oauth/callback/plex
                scopes: [openid, email, profile, groups]
                # Required, not optional: with acls.policy deny, an EMPTY
                # whitelist abstains and the abstention becomes a denial
                # (IsEmailWhitelisted). Mirrors the bridge's own allowlist.
                whitelist:
                  - "{{ .USER1_EMAIL }}"
                  - "{{ .USER2_EMAIL }}"
                  - "{{ .USER3_EMAIL }}"
                  - "{{ .USER4_EMAIL }}"
                  - "{{ .USER5_EMAIL }}"
                  - "{{ .USER6_EMAIL }}"
                  - "{{ .USER7_EMAIL }}"
                  - "{{ .USER8_EMAIL }}"
              # One provider per upstream, so the login page shows a separate
              # button for each; provider= makes the bridge skip its chooser.
              apple:
                name: Apple
                clientId: tinyauth
                clientSecretFile: /secrets/bridge-client-secret
                authUrl: https://login.56kbps.io/idp/authorize?provider=apple
                tokenUrl: http://127.0.0.1:8081/idp/token
                userinfoUrl: http://127.0.0.1:8081/idp/userinfo
                redirectUrl: https://login.56kbps.io/api/oauth/callback/apple
                scopes: [openid, email, profile, groups]
                # Required, not optional: with acls.policy deny, an EMPTY
                # whitelist abstains and the abstention becomes a denial
                # (IsEmailWhitelisted). Mirrors the bridge's own allowlist.
                whitelist:
                  - "{{ .USER1_EMAIL }}"
                  - "{{ .USER2_EMAIL }}"
                  - "{{ .USER3_EMAIL }}"
                  - "{{ .USER4_EMAIL }}"
                  - "{{ .USER5_EMAIL }}"
                  - "{{ .USER6_EMAIL }}"
                  - "{{ .USER7_EMAIL }}"
                  - "{{ .USER8_EMAIL }}"
              # Not "google": that id loads Tinyauth's built-in Google preset,
              # which skips group checks (OverrideProviders). Through the
              # bridge, Google users get groups like everyone else.
              google-sso:
                name: Google
                clientId: tinyauth
                clientSecretFile: /secrets/bridge-client-secret
                authUrl: https://login.56kbps.io/idp/authorize?provider=google
                tokenUrl: http://127.0.0.1:8081/idp/token
                userinfoUrl: http://127.0.0.1:8081/idp/userinfo
                redirectUrl: https://login.56kbps.io/api/oauth/callback/google-sso
                scopes: [openid, email, profile, groups]
                # Required, not optional: with acls.policy deny, an EMPTY
                # whitelist abstains and the abstention becomes a denial
                # (IsEmailWhitelisted). Mirrors the bridge's own allowlist.
                whitelist:
                  - "{{ .USER1_EMAIL }}"
                  - "{{ .USER2_EMAIL }}"
                  - "{{ .USER3_EMAIL }}"
                  - "{{ .USER4_EMAIL }}"
                  - "{{ .USER5_EMAIL }}"
                  - "{{ .USER6_EMAIL }}"
                  - "{{ .USER7_EMAIL }}"
                  - "{{ .USER8_EMAIL }}"
          # Forward-auth apps. Every entry sets users.allow (break-glass, a
          # local user), oauth.whitelist and oauth.groups. Tinyauth checks OAuth
          # users against the APP's oauth.whitelist, not users.allow, and under
          # acls.policy deny an empty whitelist abstains and so denies every
          # OAuth user. "/.+/" defers to the provider whitelists above (which
          # Tinyauth re-checks on every request) and lets oauth.groups decide.
          # An entry without oauth.groups would admit any OAuth user. path.allow is matched against the
          # cleaned path without its query (the old authentik skip_path_regex,
          # anchored with $).
          apps:
            audiobookshelf:
              config:
                domain: books.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media"
              path:
                allow: '^/(api|login|status|healthcheck|hls|feed|public)(/.*)?$'
            bazarr:
              config:
                domain: bazarr.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
              path:
                allow: '^/api(/.*)?$'
            lidarr:
              config:
                domain: lidarr.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
              path:
                allow: '^/api(/.*)?$'
            prowlarr:
              config:
                domain: prowlarr.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
              path:
                allow: '^/api(/.*)?$'
            qbittorrent:
              config:
                domain: qbittorrent.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
            radarr:
              config:
                domain: radarr.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
              path:
                allow: '^/api(/.*)?$'
            sabnzbd:
              config:
                domain: sab.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
            sonarr:
              config:
                domain: sonarr.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
              path:
                allow: '^/api(/.*)?$'
            tautulli:
              config:
                domain: tautulli.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media-download"
            dozzle:
              config:
                domain: logs.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "observability"
            bbs-draw:
              config:
                domain: bbs-draw.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "bbs-sysop"
            bbs-edit:
              config:
                domain: bbs-edit.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "bbs-sysop"
            echo:
              config:
                domain: echo-server.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "network"
            grafana:
              config:
                domain: grafana.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "admins,observability"
            homarr:
              config:
                domain: homarr.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "home"
            manyfold:
              config:
                domain: manyfold.56kbps.io
              users:
                allow: "{{ .USER1_USERNAME }}"
              oauth:
                whitelist: "/.+/"
                groups: "media"
          # OIDC provider (issuer https://login.56kbps.io). Tinyauth has no
          # per-client access rules, so each OIDC app is also behind
          # forward-auth (an apps entry above); Grafana also maps groups to
          # roles itself (role_attribute_strict). The signing key comes from
          # 1Password so tokens survive restarts; the public key is derived.
          oidc:
            privateKeyPath: /secrets/oidc-key.pem
            publicKeyPath: /data/oidc/key.pub
            clients:
              grafana:
                name: Grafana
                clientId: {{ .GRAFANA_CLIENT_ID | toJson }}
                clientSecret: {{ .GRAFANA_CLIENT_SECRET | toJson }}
                trustedRedirectUris:
                  - https://grafana.56kbps.io/login/generic_oauth
              homarr:
                name: Homarr
                clientId: {{ .HOMARR_CLIENT_ID | toJson }}
                clientSecret: {{ .HOMARR_CLIENT_SECRET | toJson }}
                trustedRedirectUris:
                  - https://homarr.56kbps.io/api/auth/callback/oidc
              manyfold:
                name: Manyfold
                clientId: {{ .MANYFOLD_CLIENT_ID | toJson }}
                clientSecret: {{ .MANYFOLD_CLIENT_SECRET | toJson }}
                trustedRedirectUris:
                  - https://manyfold.56kbps.io/users/auth/openid_connect/callback
          ui:
            title: 56kbps.io
        # Break-glass local login: username:bcrypt:totp. The hash was generated
        # once from the existing password, so this file only changes when the
        # 1Password fields do.
        users: "{{ .USER1_USERNAME }}:{{ .BREAKGLASS_BCRYPT }}:{{ .BREAKGLASS_TOTP }}"
        bridge-client-secret: "{{ .BRIDGE_CLIENT_SECRET }}"
        oidc-key.pem: "{{ .OIDC_PRIVATE_KEY_B64 | b64dec }}"
  # The OIDC clients reuse the apps' existing credentials (also used by the
  # apps themselves), fetched by name so other fields can't collide.
  data:
    - secretKey: GRAFANA_CLIENT_ID
      remoteRef:
        key: grafana-oidc
        property: GRAFANA_CLIENT_ID
    - secretKey: GRAFANA_CLIENT_SECRET
      remoteRef:
        key: grafana-oidc
        property: GRAFANA_CLIENT_SECRET
    - secretKey: HOMARR_CLIENT_ID
      remoteRef:
        key: homarr-oidc
        property: HOMARR_CLIENT_ID
    - secretKey: HOMARR_CLIENT_SECRET
      remoteRef:
        key: homarr-oidc
        property: HOMARR_CLIENT_SECRET
    - secretKey: MANYFOLD_CLIENT_ID
      remoteRef:
        key: manyfold
        property: MANYFOLD_CLIENT_ID
    - secretKey: MANYFOLD_CLIENT_SECRET
      remoteRef:
        key: manyfold
        property: MANYFOLD_CLIENT_SECRET
  dataFrom:
    - extract:
        key: tinyauth

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinyauth
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      # `main`: the litestream component patches this controller by name.
      main:
        # One replica: SQLite is single-writer.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tinyauthapp/tinyauth
              tag: v5.2.0@sha256:220aa235c76393a73fece831d7ba967b8698d3907fd8e3c4c952f699c7b142a5
            env:
              TINYAUTH_CONFIGFILE: /config/config.yaml
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: &port 3000
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          # Branding only: proxies the browser-facing route to Tinyauth and
          # injects /_brand/brand.js, which puts Plex and Apple logos on the
          # login buttons (Tinyauth hard-codes its icon map). Forward-auth
          # traffic uses the authz port and never passes through here.
          brand:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31-alpine@sha256:b9241c6e7b8e9a862f129d8d4199ab64b10390949a78bdd5603379b32c844083
            args: ["nginx", "-c", "/etc/nginx/brand/nginx.conf", "-g", "daemon off;"]
            probes:
              liveness: &brandProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_brand/brand.js
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *brandProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
          # sob/tinyauth-bridge: Plex / Apple / Google sign-in for Tinyauth's
          # generic OAuth providers. Public /idp/{authorize,login,callback}
          # come straight from the HTTPRoute; Tinyauth reaches /idp/token and
          # /idp/userinfo on localhost.
          bridge:
            image:
              repository: ghcr.io/sob/tinyauth-bridge
              tag: sha-ecc336a
            args: ["-config", "/bridge/config.yaml"]
            probes:
              liveness: &bridgeProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *bridgeProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: main
        ports:
          # Browser-facing: through the branding sidecar.
          http:
            port: 8080
          # Direct to Tinyauth, for Envoy ext-auth checks (no sidecar hop).
          authz:
            port: *port
          # The bridge's public endpoints (/idp/...).
          idp:
            port: 8081
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.56kbps.io
          external-dns.alpha.kubernetes.io/is-public: "true"
        hostnames: ["login.56kbps.io"]
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https-56kbps
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        rules:
          # Only the bridge's browser-facing endpoints; /idp/token and
          # /idp/userinfo stay on localhost and are never routed.
          - matches:
              - path: { type: Exact, value: /idp/authorize }
              - path: { type: PathPrefix, value: /idp/login }
              - path: { type: PathPrefix, value: /idp/callback }
            backendRefs:
              - identifier: app
                port: 8081
          # Everything else: Tinyauth through the branding sidecar.
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        type: secret
        name: tinyauth-secret
        advancedMounts:
          main:
            app:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
              - path: /secrets/users
                subPath: users
                readOnly: true
              - path: /secrets/bridge-client-secret
                subPath: bridge-client-secret
                readOnly: true
      # Node-local; restored from and streamed to R2 by the litestream
      # component (mounted into the app and both litestream containers).
      data:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /data
      idp:
        type: secret
        name: tinyauth-idp-secret
        advancedMounts:
          main:
            bridge:
              - path: /bridge/config.yaml
                subPath: config.yaml
                readOnly: true
      brand:
        type: configMap
        name: tinyauth-brand
        advancedMounts:
          main:
            brand:
              - path: /etc/nginx/brand/nginx.conf
                subPath: nginx.conf
                readOnly: true
              - path: /brand/brand.js
                subPath: brand.js
                readOnly: true
              - path: /brand/brand.css
                subPath: brand.css
                readOnly: true
      tmp:
        type: emptyDir

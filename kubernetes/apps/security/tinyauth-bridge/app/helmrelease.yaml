---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinyauth-bridge
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      tinyauth-bridge:
        # One replica: pending logins, codes and tokens live in memory. A
        # restart only fails sign-ins that are in flight.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # sob/tinyauth-bridge, built by its CI on push to main.
              repository: ghcr.io/sob/tinyauth-bridge
              tag: sha-d406c0d
            args: ["-config", "/config/config.yaml"]
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: tinyauth-bridge
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.56kbps.io
          external-dns.alpha.kubernetes.io/is-public: "true"
        hostnames: ["login.56kbps.io"]
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https-56kbps
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        rules:
          # Only the browser-facing endpoints are public. /token and /userinfo
          # are reached by Tinyauth over the in-cluster Service and are never
          # routed through a gateway; /healthz is for the kubelet.
          - matches:
              - path: { type: Exact, value: /authorize }
              - path: { type: PathPrefix, value: /login }
              - path: { type: PathPrefix, value: /callback }
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: secret
        name: tinyauth-bridge-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true

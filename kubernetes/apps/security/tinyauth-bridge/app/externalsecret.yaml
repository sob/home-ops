---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tinyauth-bridge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: tinyauth-bridge-config
    template:
      engineVersion: v2
      data:
        # The whole config is rendered here so nothing identifying is committed:
        # usernames and emails are placeholders filled from the tinyauth
        # 1Password item. Groups mirror terraform/authentik/directory.tf. Only
        # users listed here can sign in through the bridge, however they
        # authenticated upstream.
        config.yaml: |
          listen: ":8080"
          publicUrl: https://login.56kbps.io
          client:
            id: tinyauth
            secret: "{{ .BRIDGE_CLIENT_SECRET }}"
            redirectUri: https://auth.56kbps.io/api/oauth/callback/bridge
          plex:
            clientIdentifier: "{{ .PLEX_CLIENT_ID }}"
            product: "56kbps"
            serverMachineIdentifier: "{{ .PLEX_SERVER_ID }}"
          apple:
            consumerKey: "{{ .APPLE_CONSUMER_KEY }}"
            privateKey: |
          {{ .APPLE_PRIVATE_KEY_B64 | b64dec | trim | indent 4 }}
          users:
            - {id: "{{ .SOB_USERNAME }}", email: "{{ .SOB_EMAIL }}", groups: [home, media, network, observability]}
            - {id: "{{ .LOB_USERNAME }}", email: "{{ .LOB_EMAIL }}", groups: [home, media]}
            - {id: "{{ .GOB_USERNAME }}", email: "{{ .GOB_EMAIL }}", groups: [media]}
            - {id: "{{ .EOB_USERNAME }}", email: "{{ .EOB_EMAIL }}", groups: [media]}
            - {id: "{{ .COB_USERNAME }}", email: "{{ .COB_EMAIL }}", groups: [media]}
  # Everything comes from the tinyauth item, so the bridge doesn't depend on
  # authentik's secrets (or their AUTHENTIK_BLUEPRINTS_* names).
  dataFrom:
    - extract:
        key: tinyauth

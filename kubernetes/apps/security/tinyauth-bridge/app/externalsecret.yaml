---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tinyauth-bridge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: tinyauth-bridge-config
    template:
      engineVersion: v2
      data:
        # The whole config is rendered here so nothing identifying is committed:
        # users are USER1..USER8 in the tinyauth 1Password item, and who is who
        # lives only there. Only users listed here can sign in through the
        # bridge, however they authenticated upstream.
        config.yaml: |
          listen: ":8080"
          publicUrl: https://login.56kbps.io
          client:
            id: tinyauth
            secret: "{{ .BRIDGE_CLIENT_SECRET }}"
            redirectUri: https://auth.56kbps.io/api/oauth/callback/bridge
          plex:
            clientIdentifier: "{{ .PLEX_CLIENT_ID }}"
            product: "56kbps"
            serverMachineIdentifier: "{{ .PLEX_SERVER_ID }}"
          apple:
            consumerKey: "{{ .APPLE_CONSUMER_KEY }}"
            privateKey: |
          {{ .APPLE_PRIVATE_KEY_B64 | b64dec | trim | indent 4 }}
          users:
            - {id: "{{ .USER1_USERNAME }}", email: "{{ .USER1_EMAIL }}", groups: [home, media, network, observability]}
            - {id: "{{ .USER2_USERNAME }}", email: "{{ .USER2_EMAIL }}", groups: [media]}
            - {id: "{{ .USER3_USERNAME }}", email: "{{ .USER3_EMAIL }}", groups: [media]}
            - {id: "{{ .USER4_USERNAME }}", email: "{{ .USER4_EMAIL }}", groups: [home, media]}
            - {id: "{{ .USER5_USERNAME }}", email: "{{ .USER5_EMAIL }}", groups: [media]}
            - {id: "{{ .USER6_USERNAME }}", email: "{{ .USER6_EMAIL }}", groups: [media]}
            - {id: "{{ .USER7_USERNAME }}", email: "{{ .USER7_EMAIL }}", groups: [media]}
            - {id: "{{ .USER8_USERNAME }}", email: "{{ .USER8_EMAIL }}", groups: [media]}
  # Everything comes from the tinyauth item, so the bridge doesn't depend on
  # authentik's secrets (or their AUTHENTIK_BLUEPRINTS_* names).
  dataFrom:
    - extract:
        key: tinyauth

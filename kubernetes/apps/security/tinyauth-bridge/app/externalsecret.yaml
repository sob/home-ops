---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tinyauth-bridge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: tinyauth-bridge-config
    template:
      engineVersion: v2
      data:
        # The whole config is rendered here so nothing identifying is committed:
        # usernames and emails are placeholders filled from 1Password. Groups
        # mirror terraform/authentik/directory.tf. Only users listed here can
        # sign in through the bridge, however they authenticated upstream.
        config.yaml: |
          listen: ":8080"
          publicUrl: https://login.56kbps.io
          client:
            id: tinyauth
            secret: "{{ .BRIDGE_CLIENT_SECRET }}"
            redirectUri: https://auth.56kbps.io/api/oauth/callback/bridge
          plex:
            clientIdentifier: "{{ .PLEX_CLIENT_ID }}"
            product: "56kbps"
            serverMachineIdentifier: "{{ .PLEX_SERVER_ID }}"
          apple:
            consumerKey: "{{ .APPLE_CONSUMER_KEY }}"
            privateKey: |
          {{ .APPLE_PRIVATE_KEY_B64 | b64dec | trim | indent 4 }}
          users:
            - {id: "{{ .SOB_USERNAME }}", email: "{{ .SOB_EMAIL }}", groups: [home, media, network, observability]}
            - {id: "{{ .LOB_USERNAME }}", email: "{{ .LOB_EMAIL }}", groups: [home, media]}
            - {id: "{{ .GOB_USERNAME }}", email: "{{ .GOB_EMAIL }}", groups: [media]}
            - {id: "{{ .EOB_USERNAME }}", email: "{{ .EOB_EMAIL }}", groups: [media]}
            - {id: "{{ .COB_USERNAME }}", email: "{{ .COB_EMAIL }}", groups: [media]}
  # Explicit properties, not dataFrom: both items have an APPLE_CONSUMER_KEY,
  # and only the tinyauth item's (new key) is valid.
  data:
    - secretKey: BRIDGE_CLIENT_SECRET
      remoteRef:
        key: tinyauth
        property: BRIDGE_CLIENT_SECRET
    - secretKey: APPLE_CONSUMER_KEY
      remoteRef:
        key: tinyauth
        property: APPLE_CONSUMER_KEY
    - secretKey: APPLE_PRIVATE_KEY_B64
      remoteRef:
        key: tinyauth
        property: APPLE_PRIVATE_KEY_B64
    - secretKey: PLEX_CLIENT_ID
      remoteRef:
        key: authentik
        property: PLEX_CLIENT_ID
    - secretKey: PLEX_SERVER_ID
      remoteRef:
        key: authentik
        property: PLEX_SERVER_ID
    - secretKey: SOB_USERNAME
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_SOB_USERNAME
    - secretKey: SOB_EMAIL
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_SOB_EMAIL
    - secretKey: LOB_USERNAME
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_LOB_USERNAME
    - secretKey: LOB_EMAIL
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_LOB_EMAIL
    - secretKey: GOB_USERNAME
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_GOB_USERNAME
    - secretKey: GOB_EMAIL
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_GOB_EMAIL
    - secretKey: EOB_USERNAME
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_EOB_USERNAME
    - secretKey: EOB_EMAIL
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_EOB_EMAIL
    - secretKey: COB_USERNAME
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_COB_USERNAME
    - secretKey: COB_EMAIL
      remoteRef:
        key: authentik
        property: AUTHENTIK_BLUEPRINTS_USERS_COB_EMAIL

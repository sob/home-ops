---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nut-upsd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nut-upsd-secret
    template:
      engineVersion: v2
      data:
        # The rack UPS (CyberPower OR1500LCDRTXL2U) through its RMCARD205.
        # ignorelb: the driver raises LB itself from the thresholds below
        # instead of trusting the card's own (later) low-battery signal. The
        # nodes shut down at 88% charge, about 5 min into an outage at today's
        # ~315 W (40 min full runtime), so the battery goes to the UniFi gear
        # that stays up. The NAS (doom) shuts itself down at the same point
        # from its own SNMP UPS client (DSM "Time before Safe Mode": 5 min).
        # runtime.low is a backstop for a much heavier load.
        ups.conf: |
          [ups]
            driver = snmp-ups
            port = 10.1.100.74
            community = public
            snmp_version = v1
            mibs = cyberpower
            pollfreq = 15
            desc = "Rack UPS (CyberPower OR1500LCDRTXL2U, RMCARD205)"
            ignorelb
            override.battery.runtime.low = 900
            override.battery.charge.low = 88
        # Loopback only: each node's Talos nut-client talks to its own upsd.
        upsd.conf: |
          LISTEN 127.0.0.1 3493
        upsd.users: |
          [{{ .NUT_USER }}]
            password = {{ .NUT_PASSWORD }}
            upsmon secondary
  dataFrom:
    - extract:
        key: nut

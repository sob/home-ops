---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nut-upsd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: nut-upsd-secret
    template:
      engineVersion: v2
      data:
        # The rack UPS (CyberPower OR1500LCDRTXL2U) through its RMCARD205.
        # ignorelb: the driver raises LB itself from the thresholds below
        # instead of trusting the card's own (later) low-battery signal, so
        # nodes shut down with 15 min or 40% left (about 26 min of battery at
        # today's 27% load, ~41 min full runtime).
        ups.conf: |
          [ups]
            driver = snmp-ups
            port = 10.1.100.74
            community = public
            snmp_version = v1
            mibs = cyberpower
            pollfreq = 15
            desc = "Rack UPS (CyberPower OR1500LCDRTXL2U, RMCARD205)"
            ignorelb
            override.battery.runtime.low = 900
            override.battery.charge.low = 40
        # Loopback only: each node's Talos nut-client talks to its own upsd.
        upsd.conf: |
          LISTEN 127.0.0.1 3493
        upsd.users: |
          [{{ .NUT_USER }}]
            password = {{ .NUT_PASSWORD }}
            upsmon secondary
  dataFrom:
    - extract:
        key: nut

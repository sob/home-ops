---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# ecobee-mqtt item (API Credential): credential = the ecobee developer key,
# refresh_token = from `ecobee-mqtt pair`; MQTT_ECOBEE_* custom fields are this
# bridge's own Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecobee-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ecobee-mqtt-secret
    template:
      engineVersion: v2
      data:
        ECOBEE_API_KEY: "{{ .credential }}"
        ECOBEE_REFRESH_TOKEN: "{{ .refresh_token }}"
        MQTT_USERNAME: "{{ .MQTT_ECOBEE_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_ECOBEE_PASSWORD }}"
  dataFrom:
    - extract:
        key: ecobee-mqtt

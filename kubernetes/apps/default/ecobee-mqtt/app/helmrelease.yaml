---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ecobee-mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      # `main`: the file-sync component patches that controller name.
      main:
        # ecobee cloud API <-> MQTT; source in sob/home-bridges. The only state is
        # the rotating refresh token in /config, kept in R2 by file-sync (ks.yaml).
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sob/ecobee-mqtt
              tag: main@sha256:cab0b7e675829af5f783ffa0e1ac5fb06d49322a7b20b2154903069e3ca101a2
            envFrom:
              - secretRef:
                  name: ecobee-mqtt-secret
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: &health 8080 }
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /readyz, port: *health }
                  periodSeconds: 15
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 128Mi
    persistence:
      config:
        type: emptyDir
        sizeLimit: 1Mi
        globalMounts:
          - path: /config
      # file-sync keeps its checksums in /tmp; the root filesystem is read-only.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

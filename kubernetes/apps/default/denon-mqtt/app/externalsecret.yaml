---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# denon-mqtt item (API Credential); MQTT_DENON_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: denon-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: denon-mqtt-secret
    template:
      engineVersion: v2
      data:
        DENON_HOST: "{{ .hostname }}"
        MQTT_USERNAME: "{{ .MQTT_DENON_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_DENON_PASSWORD }}"
  dataFrom:
    - extract:
        key: denon-mqtt

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wizarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    controllers:
      wizarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: v2026.7.1
            env:
              TZ: America/Chicago
            # Steady-state RSS measured 245Mi on 2026-08-10, against a 286.1Mi
            # limit — roughly 40Mi of headroom, and the pod was OOMKilled
            # (exit 137) shortly after start. Raised to 512Mi.
            #
            # The fractional 286.1Mi also rendered as "299997593600m", which
            # made every kubectl operation on this deployment emit
            #   Warning: spec.template.spec.containers[0].resources.limits[memory]:
            #   fractional byte value "299997593600m" is invalid, must be an integer
            # Memory limits should be whole binary units.
            resources:
              requests:
                cpu: 200m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 5690
    # No serviceMonitor: wizarr does not expose Prometheus metrics (/metrics 404).
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/is-public: "true"
        hostnames:
          - wizarr.${SECRET_DOMAIN}
          - join.${SECRET_DOMAIN}
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https-56kbps
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        rules:
          - backendRefs:
              - identifier: app
                port: 5690
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /data/database

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app wizarr
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/external
    - ../../../../components/volsync
    - ../../../../components/litestream
    - ../../../../components/file-sync
    # Migration only: seeds the DB from the old PVC on first start. Remove
    # (with volsync and the PVC) once litestream/wizarr exists in R2.
    - ../../../../components/litestream-seed
  dependsOn:
    - name: plex
    - name: seerr
  path: ./kubernetes/apps/default/wizarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      LITESTREAM_DB_PATH: /data/database/database.db
      FILESYNC_DIR: /data/database
      FILESYNC_FILES: "secret.key secrets.json"
      VOLSYNC_SCHEDULE: "21 1 * * *"
      VOLSYNC_CAPACITY: 2Gi
      GATUS_SUBDOMAIN: join

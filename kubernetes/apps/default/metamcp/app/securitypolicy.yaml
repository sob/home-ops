---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Tinyauth forward-auth (Envoy ext-auth); access is the "metamcp" entry in
# Tinyauth's config, which also lets the MCP endpoints and OAuth plumbing
# through to MetaMCP's own API-key/OAuth check (agents can't do a browser
# login). MetaMCP signs users in over Tinyauth OIDC, which has no per-client
# access rules, so this is what limits who can use the UI.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: metamcp
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: metamcp
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - cookie
      - accept
      - user-agent
      - authorization
      - x-forwarded-for
      - x-forwarded-proto
      - x-real-ip
    http:
      backendRefs:
        - kind: Service
          name: tinyauth
          namespace: security
          port: 8082
      path: /api/auth/envoy?path=
      headersToBackend:
        - Remote-User
        - Remote-Name
        - Remote-Email
        - Remote-Groups
        - Remote-Sub

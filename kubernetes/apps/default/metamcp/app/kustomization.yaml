---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./backendtrafficpolicy.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  - name: metamcp-admin-mcp
    files:
      - ./config/admin-mcp.mjs
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # admin-mcp.mjs has ${...} in template literals; keep Flux postBuild from
    # substituting them
    kustomize.toolkit.fluxcd.io/substitute: disabled

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metamcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: metamcp-secret
    template:
      engineVersion: v2
      data:
        # Postgres runs in the same pod and listens on localhost only.
        POSTGRES_PASSWORD: "{{ .METAMCP_POSTGRES_PASSWORD }}"
        DATABASE_URL: "postgresql://metamcp:{{ .METAMCP_POSTGRES_PASSWORD }}@127.0.0.1:5432/metamcp"
        BETTER_AUTH_SECRET: "{{ .METAMCP_BETTER_AUTH_SECRET }}"
        # Tinyauth OIDC client "metamcp"; Tinyauth reads the same two fields.
        OIDC_CLIENT_ID: "{{ .METAMCP_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .METAMCP_CLIENT_SECRET }}"
        # Bearer token for the admin-mcp sidecar (/admin/mcp).
        ADMIN_MCP_TOKEN: "{{ .METAMCP_ADMIN_TOKEN }}"
        # Credentials for MCP servers that MetaMCP runs. A server's env in
        # MetaMCP refers to these as "${NAME}", which MetaMCP fills in from its
        # own environment, so the values never reach its database (or the dump
        # in R2). DigiKey: the Product Information V4 app's client credentials.
        DIGIKEY_CLIENT_ID: "{{ .DIGIKEY_CLIENT_ID }}"
        DIGIKEY_CLIENT_SECRET: "{{ .DIGIKEY_CLIENT_SECRET }}"
  data:
    - secretKey: DIGIKEY_CLIENT_ID
      remoteRef:
        key: digikey
        property: DIGIKEY_CLIENT_ID
    - secretKey: DIGIKEY_CLIENT_SECRET
      remoteRef:
        key: digikey
        property: DIGIKEY_CLIENT_SECRET
  dataFrom:
    - extract:
        key: metamcp

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# hue-mqtt item: the bridge's address and app key, and this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hue-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hue-mqtt-secret
    template:
      engineVersion: v2
      data:
        HUE_HOST: "{{ .HUE_HOST }}"
        HUE_APP_KEY: "{{ .HUE_APP_KEY }}"
        MQTT_USERNAME: "{{ .MQTT_HUE_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_HUE_PASSWORD }}"
  dataFrom:
    - extract:
        key: hue-mqtt

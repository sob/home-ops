---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manyfold
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        # The image starts as root and runs Manyfold as PUID/PGID (below). The
        # litestream sidecars (from the component) otherwise run as root with
        # every capability dropped, which can't write the app-owned DB.
        initContainers:
          litestream-restore:
            securityContext: &appUser
              runAsUser: 1039
              runAsGroup: 65536
          litestream:
            securityContext: *appUser
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/manyfold3d/manyfold
              tag: 0.150.0@sha256:b6ab9c6008dbb70a6316792585421dd31b688bef4404c41f83fb54f54a99b728
            env:
              TZ: America/Chicago
              # The image starts as root under s6 and drops to PUID/PGID: the
              # same uid/gid as the other media apps, so anything Manyfold
              # writes into the library (datapackage.json, uploads) matches.
              PUID: "1039"
              PGID: "65536"
              PUBLIC_HOSTNAME: "manyfold.${SECRET_DOMAIN}"
              HTTPS_ONLY: enabled
              REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/4
              # Accounts come from Tinyauth over OIDC; the first user to sign
              # in becomes Manyfold's administrator. FORCE_OIDC hides the local
              # password form. Manyfold can't use forward-auth headers for
              # identity, but securitypolicy.yaml gates access (media group).
              MULTIUSER: enabled
              OIDC_ISSUER: "https://login.${SECRET_DOMAIN}"
              OIDC_NAME: 56kbps.io
              FORCE_OIDC: enabled
            envFrom:
              - secretRef:
                  name: manyfold-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 3214
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60  # first boot runs migrations
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                # Server-side renders: sidekiq runs 4 jobs at once and f3d
                # loads whole meshes (some STLs are 1M+ triangles, 50+ MB).
                memory: 8Gi
    defaultPodOptions:
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media
                    operator: In
                    values:
                      - "true"
    service:
      app:
        controller: main
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
    persistence:
      models:
        # No mountOptions: inline NFS volumes don't support them (SSA rejects).
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_SERVER}
            path: ${SECRET_NFS_PATH_MEDIA}/Library/3d/models
        globalMounts:
          - path: /libraries/models
      cache:
        type: emptyDir
        sizeLimit: 20Gi
        globalMounts:
          - path: /usr/src/app/tmp
      # The SQLite DB (DATABASE_NAME in the secret), on node-local disk; the
      # litestream component restores it from R2 and streams it back.
      data:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /data

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manyfold
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: manyfold-secret
    template:
      engineVersion: v2
      data:
        # SQLite on a node-local emptyDir, restored from and streamed to R2 by
        # the litestream component (see ks.yaml).
        DATABASE_ADAPTER: sqlite3
        DATABASE_NAME: /data/manyfold.sqlite3
        SECRET_KEY_BASE: "{{ .MANYFOLD_SECRET_KEY_BASE }}"
        # Tinyauth OIDC client "manyfold"; Tinyauth reads the same two fields.
        OIDC_CLIENT_ID: "{{ .MANYFOLD_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .MANYFOLD_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: manyfold

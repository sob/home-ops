---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manyfold
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: manyfold-secret
    template:
      engineVersion: v2
      data:
        DATABASE_ADAPTER: postgresql
        # Literal host: must match INIT_POSTGRES_HOST in components/postgresql.
        DATABASE_HOST: postgres.database.svc.cluster.local
        DATABASE_NAME: "{{ .MANYFOLD_POSTGRES_NAME }}"
        DATABASE_USER: "{{ .MANYFOLD_POSTGRES_USER }}"
        DATABASE_PASSWORD: "{{ .MANYFOLD_POSTGRES_PASS }}"
        SECRET_KEY_BASE: "{{ .MANYFOLD_SECRET_KEY_BASE }}"
        # Authentik OAuth2 provider (terraform/authentik, "manyfold"); the
        # same two fields feed the provider's client_id/client_secret there.
        OIDC_CLIENT_ID: "{{ .MANYFOLD_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .MANYFOLD_CLIENT_SECRET }}"
        INIT_POSTGRES_DBNAME: "{{ .MANYFOLD_POSTGRES_NAME }}"
  dataFrom:
    - extract:
        key: manyfold

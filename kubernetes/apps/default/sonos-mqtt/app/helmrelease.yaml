---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonos-mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      sonos-mqtt:
        # Sonos (local UPnP) <-> MQTT; source in sob/home-bridges.
        # Stateless. Speakers push UPnP events to the LoadBalancer IP 10.1.100.207:1401
        # (sonos-pool).
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sob/sonos-mqtt
              tag: sha-7fb63b4
            envFrom:
              - secretRef:
                  name: sonos-mqtt-secret
            env:
              TZ: America/Chicago
              SONOS_CALLBACK_HOST: "10.1.100.207"
              SONOS_CALLBACK_PORT: "1401"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: &health 8080 }
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /readyz, port: *health }
                  periodSeconds: 15
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: *app
        type: LoadBalancer
        annotations:
          # Must be the IP in SONOS_CALLBACK_HOST: the speakers are told to send
          # events there. Pinned because sonos-pool can lose the race to the
          # default cilium-pool when both are created together.
          lbipam.cilium.io/ips: "10.1.100.207"
        # speakers must reach this port unchanged: soco advertises the port it binds
        ports:
          callback:
            port: 1401
            protocol: TCP
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# sonos-mqtt item (API Credential); MQTT_SONOS_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonos-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sonos-mqtt-secret
    template:
      engineVersion: v2
      data:
        SONOS_HOST: "{{ .hostname }}"
        MQTT_USERNAME: "{{ .MQTT_SONOS_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_SONOS_PASSWORD }}"
  dataFrom:
    - extract:
        key: sonos-mqtt

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weatherflow-mqtt
spec:
  groups:
    - name: weatherflow-mqtt
      rules:
        - alert: WeatherflowMqttNotReady
          # /readyz fails while MQTT or the upstream side is down.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="weatherflow-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "weatherflow-mqtt can't reach its upstream or Mosquitto"
            description: "Weather observations and rain/lightning events on MQTT is stale, so Node-RED automations using it are blind. `kubectl -n default logs deploy/weatherflow-mqtt` says which side is down."

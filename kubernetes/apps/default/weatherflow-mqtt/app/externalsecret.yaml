---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# weatherflow-mqtt item (API Credential); MQTT_WEATHERFLOW_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weatherflow-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: weatherflow-mqtt-secret
    template:
      engineVersion: v2
      data:
        WEATHERFLOW_TOKEN: "{{ .credential }}"
        MQTT_USERNAME: "{{ .MQTT_WEATHERFLOW_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_WEATHERFLOW_PASSWORD }}"
  dataFrom:
    - extract:
        key: weatherflow-mqtt

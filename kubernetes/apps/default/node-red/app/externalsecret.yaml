---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# node-red item: the flows repo deploy key, the project's credentialSecret, and
# device addresses the flows read as env vars (kept out of sob/flows).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-red
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: node-red-secret
    template:
      engineVersion: v2
      data:
        NODE_RED_CREDENTIAL_SECRET: "{{ .NODE_RED_CREDENTIAL_SECRET }}"
        FLOWS_DEPLOY_KEY_B64: "{{ .FLOWS_DEPLOY_KEY_B64 }}"
        EPSON_HOST: "{{ .EPSON_HOST }}"
        DENON_HOST: "{{ .DENON_HOST }}"
        MQTT_USERNAME: "{{ .MQTT_NODERED_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_NODERED_PASSWORD }}"
  dataFrom:
    - extract:
        key: node-red
    - extract:
        key: mqtt

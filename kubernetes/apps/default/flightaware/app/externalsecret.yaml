---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The antenna's location stays in 1Password (`flightaware` item), not git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flightaware
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flightaware-secret
    template:
      engineVersion: v2
      data:
        READSB_LAT: "{{ .READSB_LAT }}"
        READSB_LON: "{{ .READSB_LON }}"
        READSB_ALT: "{{ .READSB_ALT }}"
        # piaware reads LAT/LONG only as a fallback; FlightAware uses the
        # site location set on the claimed feeder.
        LAT: "{{ .READSB_LAT }}"
        LONG: "{{ .READSB_LON }}"
  dataFrom:
    - extract:
        key: flightaware

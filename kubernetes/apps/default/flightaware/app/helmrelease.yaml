---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flightaware
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # ADS-B feeder for the FlightAware Pro Stick. ultrafeeder decodes 1090 MHz
    # (readsb) and serves the tar1090 map; piaware feeds FlightAware from
    # ultrafeeder's Beast output and returns MLAT results to it. The pod runs
    # wherever the stick is plugged in (NFD label, see
    # kube-system/node-feature-discovery/rules). No volumes: map history is
    # disposable, and location and feeder ID live in 1Password.
    controllers:
      flightaware:
        annotations:
          reloader.stakater.com/auto: "true"
        # One USB device, so never two pods.
        strategy: Recreate
        containers:
          ultrafeeder:
            image:
              repository: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
              tag: latest-build-845@sha256:e6c8e50688ca91f00559f47074034ff145f3ed30610a27aaa9eddafdba9b22d5
            env:
              TZ: America/Chicago
              READSB_DEVICE_TYPE: rtlsdr
              READSB_RTLSDR_DEVICE: "stx:1090:0"
              READSB_GAIN: autogain
              # The Pro Stick has its own LNA, powered over USB.
              READSB_ENABLE_BIASTEE: "false"
              # piaware's MLAT results come back in on 30105.
              ULTRAFEEDER_CONFIG: mlathub,localhost,30105,beast_in
              UPDATE_TAR1090: "true"
              TAR1090_PAGETITLE: FlightAware
              TAR1090_MESSAGERATEINTITLE: "true"
              TAR1090_PLANECOUNTINTITLE: "true"
              TAR1090_ENABLE_AC_DB: "true"
              TAR1090_FLIGHTAWARELINKS: "true"
              TAR1090_SITESHOW: "true"
              TAR1090_RANGE_OUTLINE_COLORED_BY_ALTITUDE: "true"
              TAR1090_RANGERINGSDISTANCES: 50,100,150,200
              TAR1090_USEROUTEAPI: "true"
            envFrom: &envFrom
              - secretRef:
                  name: flightaware-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 80
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *probes
            securityContext:
              # USB access to the stick.
              privileged: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
          piaware:
            dependsOn: ultrafeeder
            image:
              repository: ghcr.io/sdr-enthusiasts/docker-piaware
              tag: latest-build-670@sha256:576da5db3f82a9153c64b1aff856a1e3da9040a8d9999e0c19e4b4f3362bfebe
            env:
              TZ: America/Chicago
              RECEIVER_TYPE: relay
              BEASTHOST: localhost
              BEASTPORT: "30005"
              # No FEEDER_ID yet: the first start registers a new feeder. Its ID
              # is then stored in the `flightaware` item and set here, so
              # restarts keep the same (claimed) site.
            envFrom: *envFrom
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      nodeSelector:
        flightaware.feature.node.kubernetes.io/prostick: "true"
      # metal-07 (media) is tainted; tolerate it so the stick can go there too.
      tolerations:
        - key: workload-type
          operator: Equal
          value: media
          effect: NoSchedule
    service:
      app:
        controller: flightaware
        ports:
          http:
            port: *port
            targetPort: *port
          beast-output:
            port: 30005
    route:
      app:
        hostnames: ["flightaware.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      globe-history:
        type: emptyDir
        advancedMounts:
          flightaware:
            ultrafeeder:
              - path: /var/globe_history
      graphs:
        type: emptyDir
        advancedMounts:
          flightaware:
            ultrafeeder:
              - path: /var/lib/collectd
      run-cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          flightaware:
            ultrafeeder:
              - path: /run

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# smarttub item (API Credential); MQTT_SMARTTUB_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smarttub-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: smarttub-mqtt-secret
    template:
      engineVersion: v2
      data:
        SMARTTUB_EMAIL: "{{ .username }}"
        SMARTTUB_PASSWORD: "{{ .credential }}"
        MQTT_USERNAME: "{{ .MQTT_SMARTTUB_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_SMARTTUB_PASSWORD }}"
  dataFrom:
    - extract:
        key: smarttub

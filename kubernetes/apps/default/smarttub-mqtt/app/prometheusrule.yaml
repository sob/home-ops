---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smarttub-mqtt
spec:
  groups:
    - name: smarttub-mqtt
      rules:
        - alert: SmarttubMqttNotReady
          # /readyz fails while MQTT or the upstream side is down.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="smarttub-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "smarttub-mqtt can't reach its upstream or Mosquitto"
            description: "Hot tub state on MQTT is stale, so Node-RED automations using it are blind. `kubectl -n default logs deploy/smarttub-mqtt` says which side is down."

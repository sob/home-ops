---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/guarded
    - ../../../../components/litestream
    - ../../../../components/file-sync
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/sabnzbd/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      LITESTREAM_DB_PATH: /config/admin/history1.db
      FILESYNC_DIR: /config
      # admin/ (queue, totals) lives on a node-local hostPath with incomplete/,
      # so only the ini needs R2.
      FILESYNC_FILES: sabnzbd.ini
      GATUS_SVC_PATH: "/api?mode=version"
      GATUS_SUBDOMAIN: sab

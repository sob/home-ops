---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.0.4@sha256:457be5fad7b83c338a981f1945e1ecae2dedd0cc81cdd2992673b0dc84fc2890
            env:
              TZ: America/Chicago
              SABNZBD__PORT: &port 80
              # NOTE: incomplete/ is back on NFS. Moving it to a node-local
              # hostPath is a real win — measured on this cluster with an 800MiB
              # dd (iflag=direct on reads), since par2 verify and unpack are
              # read-heavy:
              #   node-local  1.7 GB/s write   1.7 GB/s read
              #   NFS          91 MB/s write    38 MB/s read
              #   ceph-block   48 MB/s write    18 MB/s read
              # (ceph-block is network storage too and measured worse than NFS,
              # so only node-local helps.)
              #
              # But hostPath does not work here as-is. Talos gives kubelet a
              # restricted mount namespace, so it cannot create directories
              # under /var/mnt even though the path is writable from a normal
              # pod:
              #   MountVolume.SetUp failed for volume "incomplete":
              #   mkdir /var/mnt/sabnzbd-incomplete: read-only file system
              # That left sabnzbd stuck in Init:0/1 and the *arr reporting
              # downloadClientUnavailable.
              #
              # Doing this properly needs machine.kubelet.extraMounts in
              # talos/machineconfig.yaml.j2 binding /var/mnt for kubelet, then a
              # config apply to metal-07. Worth doing as its own change.
              SABNZBD__DOWNLOAD_DIR: /media/Downloads/sabnzbd/incomplete
              # Kept regardless of where incomplete/ lives: without a floor a
              # large queue can fill the volume. SAB pauses below this and
              # fulldisk_autoresume=1 resumes automatically.
              SABNZBD__DOWNLOAD_FREE: 100G
              # Where SABnzbd looks for post-processing scripts. The script
              # itself still has to be selected per category in Config →
              # Categories (tv, movies) — SABnzbd stores that in the
              # [categories] ini section, which has no env-var equivalent.
              SABNZBD__SCRIPT_DIR: /scripts
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.default,
                sabnzbd.default.svc,
                sabnzbd.default.svc.cluster,
                sabnzbd.default.svc.cluster.local,
                sab.56kbps.io
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 119Mi
              limits:
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1031
        runAsGroup: 65536
        fsGroup: 65536
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100]
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media
                    operator: In
                    values:
                      - "true"
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: *port
    # No serviceMonitor: SABnzbd has no native /metrics; metrics come from sabnzbd-exporter.
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.56kbps.io
          external-dns.alpha.kubernetes.io/is-public: "true"
        hostnames: ["sab.56kbps.io"]
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https-56kbps
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: sabnzbd
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tmp:
        type: emptyDir
      # Post-processing scripts. defaultMode 0775 so SABnzbd can execute them —
      # it silently ignores anything in script_dir that is not executable.
      scripts:
        type: configMap
        name: sabnzbd-scripts
        defaultMode: 493
        globalMounts:
          - path: /scripts
      media:
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_SERVER}
            path: ${SECRET_NFS_PATH_MEDIA}
            mountOptions:
              - nfsvers=4.1
              - hard
              - noatime
              - rsize=131072
              - wsize=131072
        globalMounts:
          - path: /media

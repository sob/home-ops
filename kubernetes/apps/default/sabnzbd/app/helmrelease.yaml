---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    controllers:
      sabnzbd:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # hostPath dirs are created 0755 root:root by kubelet and fsGroup does
          # not apply to hostPath volumes, so the app (uid 1031) cannot write to
          # the mount without this chown.
          init-incomplete:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                mkdir -p /incomplete
                # Tolerate failure when ownership is already correct: chown on a
                # dir you do not own fails even as root without CAP_CHOWN, and
                # re-running is a no-op in the normal case.
                chown 1031:65536 /incomplete 2>/dev/null || true
                chmod 0775 /incomplete 2>/dev/null || true
                # Fail loudly only if the app user genuinely cannot write.
                su -s /bin/sh -c 'touch /incomplete/.wtest && rm -f /incomplete/.wtest' \
                  1031 2>/dev/null || test -w /incomplete || {
                    echo "FATAL: /incomplete not writable by uid 1031"; exit 1; }
                echo "/incomplete ready: $(stat -c '%u:%g %a' /incomplete)"
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              # CHOWN/FOWNER are required to set ownership on the hostPath dir,
              # which kubelet creates as root:root. Without them the chown fails
              # with "Operation not permitted" even running as uid 0.
              capabilities: { add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"], drop: ["ALL"] }
          # The sabnzbd image only maps a fixed allowlist of env vars into the
          # ini — api_key, nzb_key, port, address, host_whitelist_entries and
          # local_ranges_entries. There is no generic SABNZBD__* mapping, so
          # anything else set as an env var is silently ignored: it appears in
          # the pod spec, never reaches sabnzbd.ini, and nothing warns.
          #
          # That is how download_dir stayed on NFS, download_free stayed empty
          # (no disk-full guard) and script_dir stayed empty (the import-guard
          # post-processing script never ran) even though all three were set as
          # env vars.
          #
          # These keys already exist in [misc], so this rewrites them in place
          # rather than appending. Runs as uid 1031 (inherited) which owns
          # /config. Idempotent, and a no-op on first boot before the ini exists.
          init-config:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                INI=/config/sabnzbd.ini
                [ -f "$INI" ] || { echo "no ini yet, entrypoint will seed it"; exit 0; }
                set_ini() {
                  if grep -qE "^$1 = " "$INI"; then
                    sed -i "s|^$1 = .*|$1 = $2|" "$INI"
                    echo "set $1 = $2"
                  else
                    echo "WARNING: key $1 not found in $INI — not adding it"
                  fi
                }
                set_ini download_dir /incomplete
                set_ini download_free 100G
                set_ini script_dir /scripts
                # Sonarr and Radarr detect a finished download by polling
                # SABnzbd's active history. "all-archive" moves every job to the
                # archive the instant it completes, so the *arr never sees it
                # finish and never imports it — the job just silently piles up
                # in complete/. Sonarr flags this itself:
                #
                #   Download client SABnzbd is set to remove completed
                #   downloads. This can result in downloads being removed from
                #   your client before Sonarr can import them.
                #
                # Found on 2026-08-06 with 167 folders stacked up in complete/
                # and zero imports for hours, while SABnzbd reported every one
                # of them as completed successfully. This is also the most
                # likely origin of the 41 _UNPACK_ orphans recovered earlier
                # that day — they predate the crash that was first blamed.
                set_ini history_retention_option all
                # download_free guards /incomplete (node-local NVMe). Nothing
                # guarded complete_dir, which is the NFS share — so SABnzbd
                # would happily fill it to 100% and take down every other
                # workload writing there.
                #
                # Found on 2026-08-06 with the share at 96% (1.5T free of 32T)
                # while 195 GB of UHD REMUXes were queued, several 40-80 GB
                # each. complete_free was empty; download_free 100G only ever
                # protected the local disk, which had 344 GB free and was never
                # the constraint.
                #
                # SABnzbd pauses rather than fills. Note this does not stop
                # Sonarr/Radarr grabbing — they just queue behind a paused
                # client, which is the intended failure mode.
                set_ini complete_free 500G
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.0@sha256:fca85bf363200f2fc135643469f5a159979993bbaefeff16de8f618926b498d5
            env:
              TZ: America/Chicago
              SABNZBD__PORT: &port 80
              # NOTE: download_dir, download_free and script_dir are NOT set
              # here — this image ignores env vars outside its small allowlist.
              # They are applied to sabnzbd.ini by the init-config initContainer
              # above. See that comment for the full explanation.
              #
              # incomplete/ lives on node-local disk. Measured on this cluster
              # with an 800MiB dd (iflag=direct on reads), which is what matters
              # because par2 verify and unpack are read-heavy:
              #   node-local  1.7 GB/s write   1.7 GB/s read
              #   NFS          91 MB/s write    38 MB/s read
              #   ceph-block   48 MB/s write    18 MB/s read
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd,
                sabnzbd.default,
                sabnzbd.default.svc,
                sabnzbd.default.svc.cluster,
                sabnzbd.default.svc.cluster.local,
                sab.56kbps.io
            envFrom:
              - secretRef:
                  name: sabnzbd-secret
            # SABnzbd serves its API from the same process that runs par2 repair
            # and unpack, so the HTTP interface stalls under heavy jobs. The old
            # settings (timeoutSeconds 1, failureThreshold 3, periodSeconds 10)
            # treated 30s of slow responses as a dead container.
            #
            # On 2026-08-06 that fired during a 40-minute par2 repair of a 55 GB
            # season pack on NFS. kubelet SIGTERMed the container twice; SABnzbd
            # could not finish flushing its admin files inside the 30s grace
            # period and was SIGKILLed (exit 137), truncating
            # /config/admin/postproc2.sab:
            #
            #   Loading /config/admin/postproc2.sab failed
            #   EOFError: Ran out of input
            #
            # That lost the post-processing queue and the entire history, which
            # stranded 41 finished jobs in complete/ as _UNPACK_* folders the
            # *arr never imported.
            #
            # Liveness now tolerates 3 minutes of unresponsiveness before
            # restarting. Readiness stays tighter so a genuinely wedged instance
            # still drops out of the Service, but not so tight that a normal
            # repair takes the web UI offline.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api?mode=version
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 4
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 119Mi
              limits:
                memory: 8Gi
    defaultPodOptions:
      # SABnzbd writes its queue, history and post-processing state to
      # /config/admin on shutdown. The default 30s was not enough while a repair
      # was in flight — it was SIGKILLed mid-write and postproc2.sab was left
      # truncated. See the probes comment above for the full incident.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1031
        runAsGroup: 65536
        fsGroup: 65536
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [100]
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media
                    operator: In
                    values:
                      - "true"
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: *port
    # No serviceMonitor: SABnzbd has no native /metrics; metrics come from sabnzbd-exporter.
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.56kbps.io
          external-dns.alpha.kubernetes.io/is-public: "true"
        hostnames: ["sab.56kbps.io"]
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https-56kbps
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: sabnzbd
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tmp:
        type: emptyDir
      # Post-processing scripts. defaultMode 0775 so SABnzbd can execute them —
      # it silently ignores anything in script_dir that is not executable.
      scripts:
        type: configMap
        name: sabnzbd-scripts
        defaultMode: 493
        globalMounts:
          - path: /scripts
      # Node-local scratch for in-flight downloads. Safe as a hostPath because
      # the nodeAffinity below pins this pod to nodes labelled
      # node-role.kubernetes.io/media=true, and metal-07 is currently the only
      # one — so the pod always lands on the same disk. If another node is ever
      # given that label, in-flight downloads on the old node become orphaned
      # and SAB will re-fetch them.
      #
      # MUST be under /var/local-storage. Talos gives kubelet a restricted mount
      # namespace: /var/local-storage is a built-in writable path, but /var/mnt
      # is reserved for declared user disks and kubelet cannot create
      # directories there, so DirectoryOrCreate fails with
      # "mkdir /var/mnt/...: read-only file system" and the pod hangs in Init.
      # Confusingly a normal pod CAN write to /var/mnt — only kubelet cannot.
      # This is the same path the old OpenEBS localpv used (3d83edb6), and it
      # needs no machine.kubelet.extraMounts and no local CSI provisioner.
      incomplete:
        type: hostPath
        hostPath: /var/local-storage/sabnzbd-incomplete
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /incomplete
      media:
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_SERVER}
            path: ${SECRET_NFS_PATH_MEDIA}
            mountOptions:
              - nfsvers=4.1
              - hard
              - noatime
              - rsize=131072
              - wsize=131072
        globalMounts:
          - path: /media

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute-outpost.yaml
  - ./securitypolicy.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: sabnzbd-scripts
    files:
      - import-guard.py=./resources/import-guard.py
generatorOptions:
  disableNameSuffixHash: true

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# epson-mqtt item (API Credential); MQTT_EPSON_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: epson-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: epson-mqtt-secret
    template:
      engineVersion: v2
      data:
        EPSON_HOST: "{{ .hostname }}"
        MQTT_USERNAME: "{{ .MQTT_EPSON_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_EPSON_PASSWORD }}"
  dataFrom:
    - extract:
        key: epson-mqtt

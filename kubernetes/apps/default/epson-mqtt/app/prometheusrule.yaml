---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: epson-mqtt
spec:
  groups:
    - name: epson-mqtt
      rules:
        - alert: EpsonMqttNotReady
          # /readyz fails while MQTT or the upstream side is down.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="epson-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "epson-mqtt can't reach its upstream or Mosquitto"
            description: "Projector state and power commands on MQTT is stale, so Node-RED automations using it are blind. `kubectl -n default logs deploy/epson-mqtt` says which side is down."

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app audiobookshelf
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/guarded
    - ../../../../components/volsync
    - ../../../../components/litestream
    # Migration only: seeds the DB from the old PVC on first start. Remove
    # (with volsync and the PVC) once litestream/audiobookshelf exists in R2.
    - ../../../../components/litestream-seed
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/audiobookshelf/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      LITESTREAM_DB_PATH: /config/absdatabase.sqlite
      # App is "audiobookshelf" but it is served at books.*, so the gatus
      # endpoint must be told the real subdomain or it probes a host that
      # does not exist.
      GATUS_SUBDOMAIN: books
      GATUS_SVC_PATH: /healthcheck
      VOLSYNC_SCHEDULE: "31 0 * * *"
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_UID: "1035"
      VOLSYNC_GID: "65536"
      VOLSYNC_FSGROUP: "65536"

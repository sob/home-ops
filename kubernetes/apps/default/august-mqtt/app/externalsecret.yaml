---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# august-mqtt item (API Credential): credential = access token from
# `august-mqtt pair`; MQTT_AUGUST_* are this bridge's own Mosquitto login
# (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: august-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: august-mqtt-secret
    template:
      engineVersion: v2
      data:
        AUGUST_TOKEN: "{{ .credential }}"
        MQTT_USERNAME: "{{ .MQTT_AUGUST_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_AUGUST_PASSWORD }}"
  dataFrom:
    - extract:
        key: august-mqtt

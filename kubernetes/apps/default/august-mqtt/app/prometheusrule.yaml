---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: august-mqtt
spec:
  groups:
    - name: august-mqtt
      rules:
        - alert: AugustMqttNotReady
          # /readyz fails while MQTT is down or the August token is rejected.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="august-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "august-mqtt can't reach the August API or Mosquitto"
            description: "Lock and door state on MQTT is stale. `kubectl -n default logs deploy/august-mqtt` says which side is down; \"re-pair\" means running `august-mqtt pair` and updating the credential in 1Password."

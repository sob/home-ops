---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app august-mqtt
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/file-sync
  dependsOn:
    - name: mosquitto
      namespace: database
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/august-mqtt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      FILESYNC_DIR: /config
      # yalexs renews the access token before it expires; the bridge keeps the
      # latest here. Optional: without it the bridge uses the token in 1Password
      # (AUGUST_TOKEN), which works until it expires (then re-pair).
      FILESYNC_FILES: "august-token.json?"

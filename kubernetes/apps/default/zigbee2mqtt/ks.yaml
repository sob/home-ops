---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/guarded
    - ../../../../components/file-sync
  dependsOn:
    - name: mosquitto
      namespace: database
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/zigbee2mqtt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: zigbee
      GATUS_SVC_PORT: "8080"
      FILESYNC_DIR: /config
      # All optional: the network starts fresh (no devices yet), and its key,
      # PAN and extended PAN come from 1Password, so losing these files costs
      # device names and state, not the network. coordinator_backup.json lets
      # z2m restore the network onto a replacement coordinator.
      FILESYNC_FILES: "configuration.yaml? database.db? coordinator_backup.json? state.json?"

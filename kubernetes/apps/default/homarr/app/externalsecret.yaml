---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homarr-secret
    template:
      engineVersion: v2
      data:
        AUTH_PROVIDERS: "oidc,credentials"
        AUTH_OIDC_CLIENT_ID: "{{ .HOMARR_CLIENT_ID }}"
        AUTH_OIDC_CLIENT_SECRET: "{{ .HOMARR_CLIENT_SECRET }}"
        # Tinyauth OIDC (security/tinyauth). Access is also gated by the
        # SecurityPolicy (home group); admins get Homarr admin/owner.
        AUTH_OIDC_CLIENT_NAME: "56kbps.io"
        AUTH_OIDC_ISSUER: "https://login.${SECRET_DOMAIN}"
        AUTH_LOGOUT_REDIRECT_URL: "https://login.${SECRET_DOMAIN}"
        AUTH_OIDC_AUTO_LOGIN: "false"
        AUTH_OIDC_ADMIN_GROUP: "admins"
        AUTH_OIDC_OWNER_GROUP: "admins"
        OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"

        SECRET_ENCRYPTION_KEY: "{{ .HOMARR_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: homarr
    - extract:
        key: homarr-oidc

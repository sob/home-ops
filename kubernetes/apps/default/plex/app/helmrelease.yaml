---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: intel-device-plugin-gpu
      namespace: kube-system
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        # Config lives on node-local disk on metal-07 (hostPath), not Ceph. When
        # that directory is empty (new node, wiped disk), restore the newest
        # backup from the restic repo; on this first run, before the backup job
        # has written one, copy the old Ceph PVC mounted at /seed. With neither,
        # fail rather than start Plex unconfigured.
        initContainers:
          restore:
            image: &restic
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                if [ -e /data/Preferences.xml ]; then
                  echo "local data present; not restoring"
                elif [ -e /seed/Preferences.xml ]; then
                  cp -a /seed/. /data/
                  echo "seeded from the old PVC"
                else
                  # Only this job's snapshots (host plex), not volsync's.
                  restic restore latest:/data --host plex --target /data --no-cache
                  echo "restored the latest restic snapshot"
                fi
                # hostPath dirs are created root:root, and fsGroup doesn't apply
                # to hostPath volumes.
                chown 1030:65536 /data
            envFrom: &resticEnv
              - secretRef:
                  name: plex-restic-secret
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: America/Chicago
              PLEX_ADVERTISE_URL: https://plex.${SECRET_DOMAIN}:443,http://${SECRET_VIP_PLEX}:32400
              PLEX_NO_AUTH_NETWORKS: ${SECRET_CIDR},10.244.0.0/16,10.43.0.0/12
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  # /identity can take >1s when Plex is busy or its SQLite DB is
                  # waiting on ceph-block; a 1s timeout was SIGKILLing Plex
                  # (exitCode 137, 12 restarts) and dropping client sessions.
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                gpu.intel.com/i915: "1"
              limits:
                memory: 16Gi
                gpu.intel.com/i915: "1"
          log-tailer:
            image:
              repository: busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command: ["/bin/sh", "-c"]
            args: ["until [ -f /logs/Plex\\ Media\\ Server.log ]; do sleep 1; done; tail -F /logs/Plex\\ Media\\ Server.log"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
      # Nightly restic backup of the config to stone-volsync/plex (the repo
      # volsync used). Cache and Logs aren't backed up. Plex keeps its own
      # consistent DB copies every three days (com.plexapp.plugins.library.db-
      # YYYY-MM-DD), which go in with everything else.
      backup:
        type: cronjob
        cronjob:
          schedule: "30 3 * * *"
          timeZone: America/Chicago
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 2
        containers:
          app:
            image: *restic
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                cd /data
                # Clears locks left by a killed run; live ones are kept.
                restic unlock
                restic backup . --host plex \
                  --exclude ./Cache --exclude ./Logs \
                  --exclude "./Crash Reports" --exclude ./Diagnostics
                if [ "$(date +%u)" = 7 ]; then
                  restic forget --host plex --keep-daily 7 --keep-weekly 4 --prune
                else
                  restic forget --host plex --keep-daily 7 --keep-weekly 4
                fi
            env:
              RESTIC_CACHE_DIR: /tmp/restic-cache
            envFrom: *resticEnv
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # The config is a hostPath on this node; see the restore init container.
      nodeSelector:
        kubernetes.io/hostname: metal-07
      securityContext:
        runAsNonRoot: true
        runAsUser: 1030
        runAsGroup: 65536
        fsGroup: 65536
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 100]
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media
                    operator: In
                    values:
                      - "true"
    service:
      app:
        controller: plex
        ports:
          http:
            port: 32400
      lb:
        controller: plex
        type: LoadBalancer
        ports:
          http:
            port: 32400
    # No serviceMonitor: Plex serves no unauthenticated /metrics (needs an X-Plex-Token).
    route:
      app:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/is-public: "true"
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https-56kbps
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        hostnames:
          - "plex.${SECRET_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: plex-app
                port: 32400
    persistence:
      config:
        type: hostPath
        hostPath: /var/local-storage/plex
        hostPathType: DirectoryOrCreate
        advancedMounts:
          plex:
            app:
              - path: /config/Library/Application Support/Plex Media Server
            restore:
              - path: /data
          backup:
            app:
              - path: /data
                readOnly: true
      # The old Ceph PVC, only as the restore's first-run seed. Removed with
      # volsync once the backup job has written a snapshot.
      seed:
        existingClaim: plex
        advancedMounts:
          plex:
            restore:
              - path: /seed
                readOnly: true
      # Disposable, so not on the hostPath (and not backed up).
      cache:
        type: emptyDir
        advancedMounts:
          plex:
            app:
              - path: /config/Library/Application Support/Plex Media Server/Cache
      logs:
        type: emptyDir
        advancedMounts:
          plex:
            app:
              - path: /config/Library/Application Support/Plex Media Server/Logs
            log-tailer:
              - path: /logs
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
        sizeLimit: 24Gi
        advancedMounts:
          plex:
            app:
              - path: /transcode
      media:
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_SERVER}
            path: ${SECRET_NFS_PATH_MEDIA}/Library
            mountOptions:
              - nfsvers=4.1
              - hard
              - noatime
              - rsize=131072
              - wsize=131072
        advancedMounts:
          plex:
            app:
              - path: /media
                readOnly: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qbittorrent
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/guarded
    - ../../../../components/volsync
    - ../../../../components/litestream
    - ../../../../components/file-sync
    # Migration only: seeds the DB from the old PVC on first start. Remove
    # (with volsync and the PVC) once litestream/qbittorrent exists in R2.
    - ../../../../components/litestream-seed
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/qbittorrent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      LITESTREAM_DB_PATH: /config/qBittorrent/torrents.db
      LITESTREAM_SEED: qBittorrent/torrents.db
      FILESYNC_DIR: /config
      FILESYNC_FILES: "qBittorrent/qBittorrent.conf qBittorrent/qBittorrent-data.conf? qBittorrent/categories.json? qBittorrent/watched_folders.json? qBittorrent/rss/feeds.json?"
      # qbittorrent's only probe is a tcpSocket and its API needs auth, so the
      # in-cluster check falls back to the WebUI root serving a 200.
      GATUS_SVC_PATH: /
      GATUS_SUBDOMAIN: qbittorrent
      VOLSYNC_SCHEDULE: "15 0 * * *"
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_STORAGECLASS: ceph-block
      VOLSYNC_SNAPSHOTCLASS: csi-ceph-blockpool
      VOLSYNC_UID: "1038"
      VOLSYNC_GID: "65536"
      VOLSYNC_FSGROUP: "65536"

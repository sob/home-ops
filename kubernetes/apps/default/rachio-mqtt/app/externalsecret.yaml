---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# rachio-mqtt item (API Credential); MQTT_RACHIO_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rachio-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rachio-mqtt-secret
    template:
      engineVersion: v2
      data:
        RACHIO_API_KEY: "{{ .credential }}"
        MQTT_USERNAME: "{{ .MQTT_RACHIO_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_RACHIO_PASSWORD }}"
  dataFrom:
    - extract:
        key: rachio-mqtt

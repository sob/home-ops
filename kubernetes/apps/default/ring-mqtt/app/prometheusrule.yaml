---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ring-mqtt
spec:
  groups:
    - name: ring-mqtt
      rules:
        - alert: RingMqttNotReady
          # Not ready while the auth web UI on :55123 is up, i.e. Ring rejected the saved token.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="ring-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ring-mqtt has no working Ring refresh token"
            description: "`kubectl -n default logs deploy/ring-mqtt`; re-auth with `kubectl -n default port-forward deploy/ring-mqtt 55123` and sign in at http://localhost:55123 (file-sync pushes the new ring-state.json to R2)."

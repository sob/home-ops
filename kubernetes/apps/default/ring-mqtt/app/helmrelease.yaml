---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ring-mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      # `main`: the file-sync component patches that controller name.
      main:
        # tsightler/ring-mqtt as-is. Its only state is /data/ring-state.json (the
        # rotating refresh token and systemId), kept in R2 by file-sync (ks.yaml).
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Runs after file-sync-restore: the token from 1Password only seeds a
          # state file R2 didn't have. config.json is rewritten every start.
          seed:
            dependsOn: file-sync-restore
            image: &image
              repository: docker.io/tsightler/ring-mqtt
              tag: 5.9.3@sha256:4a4e0db460d7023aa5851ff25491401fd23b2fd153b7269af481f0953cd6f00a
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                cp /secret/config.json /data/config.json
                if [ ! -s /data/ring-state.json ]; then
                  jq -n --arg t "$RING_TOKEN" '{ring_token: $t}' > /data/ring-state.json
                  echo "seeded ring-state.json from 1Password"
                fi
            env:
              RING_TOKEN:
                valueFrom:
                  secretKeyRef: { name: ring-mqtt-secret, key: RING_TOKEN }
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            # Skip the s6 /init entrypoint (it needs root) and run the bridge directly.
            command: ["node", "/app/ring-mqtt/ring-mqtt.js"]
            env:
              TZ: America/Chicago
              RUNMODE: docker
              DEBUG: ring-*
              HOME: /tmp
            probes:
              liveness:
                enabled: false
              startup:
                enabled: false
              readiness:
                # No health endpoint. The auth web UI on :55123 only runs while
                # there's no usable refresh token, so listening = not ready.
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/bash", "-c", "! (exec 3<>/dev/tcp/127.0.0.1/55123) 2>/dev/null"]
                  periodSeconds: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 384Mi
    persistence:
      data:
        type: emptyDir
        sizeLimit: 16Mi
        globalMounts:
          - path: /data
      secret:
        type: secret
        name: ring-mqtt-secret
        advancedMounts:
          main:
            seed:
              - path: /secret
                readOnly: true
      # file-sync keeps its checksums in /tmp; the root filesystem is read-only.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

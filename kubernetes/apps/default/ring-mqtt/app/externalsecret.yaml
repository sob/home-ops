---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# ring-mqtt item (API Credential): credential = Ring refresh token (only seeds
# /data/ring-state.json when R2 has none); MQTT_RING_* are this bridge's own
# Mosquitto login (also read by database/mosquitto). The password is hex: it
# goes into mqtt_url unescaped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ring-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ring-mqtt-secret
    template:
      engineVersion: v2
      data:
        RING_TOKEN: "{{ .credential }}"
        # ring-mqtt 5.x in Docker reads only /data/config.json, no env vars.
        # enable_cameras=false also drops doorbell ding/motion, not just video.
        config.json: |
          {
            "mqtt_url": "mqtt://{{ .MQTT_RING_USERNAME }}:{{ .MQTT_RING_PASSWORD }}@mosquitto.database.svc.cluster.local:1883",
            "mqtt_options": "",
            "livestream_user": "",
            "livestream_pass": "",
            "disarm_code": "",
            "enable_cameras": false,
            "enable_modes": false,
            "enable_panic": false,
            "hass_topic": "homeassistant/status",
            "ring_topic": "ring",
            "location_ids": []
          }
  dataFrom:
    - extract:
        key: ring-mqtt

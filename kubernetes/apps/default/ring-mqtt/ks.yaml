---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ring-mqtt
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/file-sync
  dependsOn:
    - name: mosquitto
      namespace: database
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/ring-mqtt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      FILESYNC_DIR: /data
      # ring-mqtt rotates the Ring refresh token and rewrites ring_token here (with the
      # systemId Ring knows this client by). Optional: on first start the seed init
      # container writes it from the token in 1Password (ring-mqtt item).
      FILESYNC_FILES: "ring-state.json?"

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: volsync
      namespace: storage
  values:
    controllers:
      seerr:
        annotations:
          reloader.stakater.com/auto: "true"
        # The SQLite DB lives on node-local emptyDir, not Ceph: on the QVO-backed
        # OSDs every fsync took 300-600ms, which filled Node's libuv threadpool and
        # stalled the whole app (and its DNS lookups) until the liveness probe
        # killed it. Litestream streams it to R2 continuously and restores it on
        # start, so the pod can still move nodes without losing data.
        initContainers:
          restore:
            image: &litestream
              repository: docker.io/litestream/litestream
              tag: 0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
            # No fallback seed: the pre-migration DB left on the Ceph PVC is frozen,
            # and silently restoring it would lose everything since. With no
            # replica in R2 this starts Seerr empty, which is obvious.
            args:
              - restore
              - -config
              - /etc/litestream.yml
              - -if-db-not-exists
              - -if-replica-exists
              - /app/config/db/db.sqlite3
            securityContext: &litestreamSecurityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          litestream:
            dependsOn: restore
            image: *litestream
            args: ["replicate", "-config", "/etc/litestream.yml"]
            # Native sidecar: starts after restore, and stops only after the app
            # exits, so the final writes are flushed to R2 on shutdown.
            restartPolicy: Always
            securityContext: *litestreamSecurityContext
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
            env:
              TZ: America/Chicago
              LOG_LEVEL: "info"
              PORT: &port 5055
              NODE_OPTIONS: --dns-result-order=ipv4first
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media
                    operator: In
                    values:
                      - "true"
    service:
      app:
        controller: seerr
        ports:
          http:
            port: *port
    # No serviceMonitor: seerr has no native /metrics; metrics come from seerr-exporter.
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/is-public: "true"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}", "overseerr.${SECRET_DOMAIN}", "requests.${SECRET_DOMAIN}"]
        parentRefs:
          - name: external-gateway
            namespace: network
            sectionName: https-56kbps
          - name: internal-gateway
            namespace: network
            sectionName: https-56kbps
        rules:
          # TMDB artwork is served through the Varnish cache; everything else
          # (UI, API) goes straight to the app.
          - matches:
              - path:
                  type: PathPrefix
                  value: /imageproxy
            backendRefs:
              - name: varnish
                port: 80
          - backendRefs:
              - port: *port
                identifier: app
    persistence:
      # Still on Ceph (and volsync): settings.json is rarely written. Its db/
      # directory is shadowed by the emptyDir below and no longer used.
      config:
        existingClaim: overseerr
        advancedMounts:
          seerr:
            app:
              - path: /app/config
      db:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /app/config/db
      litestream-config:
        type: secret
        name: seerr-litestream-secret
        advancedMounts:
          seerr:
            restore: &litestreamConfig
              - path: /etc/litestream.yml
                subPath: litestream.yml
                readOnly: true
            litestream: *litestreamConfig
      # Image-proxy cache: disposable, and written on every artwork load, so
      # keep it off Ceph. ~250MB in practice; Varnish fronts it anyway.
      cache:
        type: emptyDir
        sizeLimit: 2Gi
        advancedMounts:
          seerr:
            app:
              - path: /app/config/cache
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
      tmp:
        type: emptyDir

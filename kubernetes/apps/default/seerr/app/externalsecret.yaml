---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seerr-litestream
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seerr-litestream-secret
    template:
      engineVersion: v2
      data:
        # Rendered whole here rather than via litestream's $VAR expansion, which
        # would collide with Flux postBuild substitution. Same R2 bucket and key as
        # volsync (REPOSITORY_TEMPLATE is "s3:https://<acct>.r2.cloudflarestorage.com/stone-volsync").
        litestream.yml: |
          dbs:
            - path: /app/config/db/db.sqlite3
              replica:
                type: s3
                bucket: stone-volsync
                path: litestream/seerr
                endpoint: {{ .REPOSITORY_TEMPLATE | trimPrefix "s3:" | trimSuffix "/stone-volsync" }}
                region: auto
                force-path-style: true
                access-key-id: {{ .AWS_ACCESS_KEY_ID }}
                secret-access-key: {{ .AWS_SECRET_ACCESS_KEY }}
        # rclone remote "r2" (env-configured) for settings.json, which isn't
        # SQLite and so isn't Litestream's: same bucket and credentials.
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ENDPOINT: '{{ .REPOSITORY_TEMPLATE | trimPrefix "s3:" | trimSuffix "/stone-volsync" }}'
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
  dataFrom:
    - extract:
        key: cloudflare
    - extract:
        key: volsync-r2-template

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rtlamr2mqtt
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: rtlamr2mqtt-secret
    template:
      engineVersion: v2
      data:
        rtlamr2mqtt.yaml: |
          general:
            sleep_for: 0
            verbosity: info
            tickle_rtl_tcp: false
            # Index of the RTL-SDR on this node (2026.5 wants an integer, not
            # vendor:product). metal-05 has two NESDRs; either reads both meters.
            device_id: 0
          mqtt:
            host: mosquitto.database.svc.cluster.local
            port: 1883
            tls_enabled: false
            user: "{{ .MQTT_RTLAMR2MQTT_USERNAME }}"
            password: "{{ .MQTT_RTLAMR2MQTT_PASSWORD }}"
            ha_autodiscovery: false
            ha_autodiscovery_topic: homeassistant
            base_topic: rtlamr
          custom_parameters:
            rtltcp: -s 2048000
            rtlamr: -unique=true -symbollength=32
          meters:
            - id: "{{ .RTLAMR2MQTT_SPRINKLER_METER_ID }}"
              protocol: r900
              name: sprinkler_water_meter
              format: "######"
              unit_of_measurement: gal
              icon: mdi:gauge
              device_class: water
            - id: "{{ .RTLAMR2MQTT_WATER_METER_ID }}"
              protocol: r900
              name: home_water_meter
              format: "######"
              unit_of_measurement: gal
              icon: mdi:gauge
              device_class: water
  dataFrom:
    - extract:
        key: mqtt
    - extract:
        key: rtlamr2mqtt

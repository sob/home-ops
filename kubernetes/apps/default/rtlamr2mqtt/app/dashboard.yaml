---
# Water meters (rtlamr2mqtt → mqtt-exporter → water:* recording rules). One row
# per meter, House first. Meter names come from the recording rules, so no
# meter IDs are in git. Units are the meter's raw register counts until
# calibrated against the bill or the meter face.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-water-meters
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Home"
    # Grafana variables (${meter}, $__range) aren't Flux postBuild variables.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  water-meters.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": [
        "water",
        "rtlamr"
      ],
      "title": "Water \u2014 Meters",
      "uid": "water-meters",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "description": "Neptune R900 water meters read by radio (rtlamr2mqtt). House meter first, then the sprinkler meter.",
      "templating": {
        "list": [
          {
            "name": "meter",
            "label": "Meter",
            "type": "custom",
            "query": "House,Sprinkler",
            "options": [
              {
                "selected": true,
                "text": "House",
                "value": "House"
              },
              {
                "selected": true,
                "text": "Sprinkler",
                "value": "Sprinkler"
              }
            ],
            "multi": true,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": [
                "House",
                "Sprinkler"
              ],
              "value": [
                "House",
                "Sprinkler"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "$meter water meter",
          "repeat": "meter",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Reading",
          "description": "The meter's cumulative register: it only ever goes up, like an odometer. Units are the meter's raw counts (about 0.1 gallon each, pending calibration against the bill or the meter face). A reading that jumps backwards means the meter or its radio was replaced.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "water:reading{meter=\"$meter\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "graphMode": "none",
            "textMode": "value"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Leak now",
          "description": "The meter's own leak detection (Neptune R900 'LeakNow'): non-zero means water never stopped flowing for a long stretch in the last ~24 h. House: usually a toilet flapper (put food colouring in the tank, wait 15 min without flushing, look for colour in the bowl), a dripping tap or a softener stuck in regeneration. Sprinkler: a valve that didn't close or a broken line. WaterLeakDetected alerts after a further 24 h.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(water:leak_now{meter=\"$meter\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "No leak",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": 1,
                    "to": 9,
                    "result": {
                      "text": "LEAK",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 5,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Usage today",
          "description": "Counts used since midnight (raw units, ~0.1 gal each). A typical US household uses roughly 80\u2013100 gallons per person per day indoors. The sprinkler meter should read 0 on days with no scheduled watering (Rachio: Flower Beds at 10:00 and at sunset).",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max_over_time(water:reading{meter=\"$meter\"}[$__range]) - min_over_time(water:reading{meter=\"$meter\"}[$__range])",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "timeFrom": "now/d",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "graphMode": "none"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 9,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Readings / 10 min",
          "description": "Radio messages heard from this meter in the last 10 minutes. R900 meters transmit every few seconds, but the basement antenna only catches some. Anything above 0 is healthy; 0 for 2 h raises WaterMeterSilent (check rtlamr2mqtt and the NESDR on the node labelled nesdr.feature.node.kubernetes.io/rtlamr).",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(water:messages_total{meter=\"$meter\"}[10m]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 14,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "stat",
          "title": "Backflow",
          "description": "The meter's backflow flag (0 = none). Water flowed backwards through the meter, e.g. a pressure drop on the street side (main break, hydrant flushing) or a failing backflow preventer. One-off small events are common; a persistent flag on the sprinkler meter is worth having the backflow device tested.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(water:backflow{meter=\"$meter\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 19,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Usage per hour",
          "description": "Raw units used in each hour. House: showers, laundry and dishwasher show as tall bars in the morning and evening; flat non-zero bars all night point to a leak. Sprinkler: should only rise during Rachio's schedule windows; usage at any other time means a stuck valve or manual watering.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "increase(water:reading{meter=\"$meter\"}[1h])",
              "legendFormat": "per hour",
              "refId": "A",
              "interval": "1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "barchart",
          "title": "Usage per day (14 days)",
          "description": "Raw units used per day. Compare weekdays with weekends and look for a rising trend; a sudden permanent step up usually means a new leak (house) or a schedule change (sprinkler).",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "increase(water:reading{meter=\"$meter\"}[1d])",
              "legendFormat": "",
              "refId": "A",
              "interval": "1d"
            }
          ],
          "timeFrom": "14d",
          "interval": "1d",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "xTickLabelRotation": -45,
            "legend": {
              "showLegend": false
            }
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        },
        {
          "type": "timeseries",
          "title": "Overnight baseline: a floor above zero means a leak",
          "description": "Usage per 15 minutes. Between about 2 and 5 AM nobody uses water, so the line should touch zero. If it never does, that floor is the leak rate: roughly 1\u20133 units per 15 min is a slowly leaking toilet flapper, 10+ is a running toilet or a broken pipe. After fixing a leak the overnight floor should drop to zero the next night.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "increase(water:reading{meter=\"$meter\"}[15m])",
              "legendFormat": "per 15 min",
              "refId": "A",
              "interval": "15m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false
            }
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        }
      ]
    }

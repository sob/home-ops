---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# uinetwork-mqtt item (API Credential); MQTT_UINETWORK_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uinetwork-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: uinetwork-mqtt-secret
    template:
      engineVersion: v2
      data:
        UNIFI_HOST: "{{ .hostname }}"
        UNIFI_API_KEY: "{{ .credential }}"
        # opt-in list of label=<MAC or client name>; kept out of git
        TRACKED_CLIENTS: "{{ .TRACKED_CLIENTS }}"
        MQTT_USERNAME: "{{ .MQTT_UINETWORK_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_UINETWORK_PASSWORD }}"
  dataFrom:
    - extract:
        key: uinetwork-mqtt

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uinetwork-mqtt
spec:
  groups:
    - name: uinetwork-mqtt
      rules:
        - alert: UinetworkMqttNotReady
          # /readyz fails while MQTT or the upstream side is down.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="uinetwork-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "uinetwork-mqtt can't reach the UniFi console or Mosquitto"
            description: "Client presence on MQTT is stale, so presence automations are blind. `kubectl -n default logs deploy/uinetwork-mqtt` says which side is down."

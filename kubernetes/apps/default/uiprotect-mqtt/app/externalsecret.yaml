---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# uiprotect-mqtt item: the UniFi console and a Protect Integration API key, and
# this bridge's own Mosquitto login (also read by database/mosquitto).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uiprotect-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: uiprotect-mqtt-secret
    template:
      engineVersion: v2
      data:
        PROTECT_HOST: "{{ .PROTECT_HOST }}"
        PROTECT_API_KEY: "{{ .PROTECT_API_KEY }}"
        MQTT_USERNAME: "{{ .MQTT_UIPROTECT_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_UIPROTECT_PASSWORD }}"
  dataFrom:
    - extract:
        key: uiprotect-mqtt

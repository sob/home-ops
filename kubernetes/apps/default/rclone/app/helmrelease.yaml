---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rclone
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Interactive workbench: `kubectl exec -it deploy/rclone -- sh`, then run
    # rclone by hand. No service/route — nothing listens.
    controllers:
      main:
        strategy: Recreate
        containers:
          app:
            image:
              repository: rclone/rclone
              tag: 1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command: ["sleep", "infinity"]
            env:
              TZ: America/Chicago
              HOME: /config
              # Writable and synced to R2 by file-sync (see ks.yaml), so OAuth
              # token refreshes persist; a Secret mount would be read-only and
              # rclone rewrites the token on refresh.
              RCLONE_CONFIG: /config/rclone.conf
              RCLONE_CACHE_DIR: /tmp/rclone
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # Same uid/gid as the other media apps so files land on the NAS with
      # ownership manyfold (and friends) can read.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1039
        runAsGroup: 65536
        fsGroup: 65536
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "media"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/media
                    operator: In
                    values:
                      - "true"
    persistence:
      # rclone.conf and pull.sh are kept in R2 by the file-sync component;
      # inventory/ and logs/ from past runs are scratch.
      config:
        type: emptyDir
        sizeLimit: 512Mi
        globalMounts:
          - path: /config
      media:
        # No mountOptions: inline pod NFS volumes don't support them, and
        # helm-controller's server-side apply rejects the unknown field.
        type: custom
        volumeSpec:
          nfs:
            server: ${SECRET_NFS_SERVER}
            path: ${SECRET_NFS_PATH_MEDIA}
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

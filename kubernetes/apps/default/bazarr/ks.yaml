---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/guarded
    # DB on Litestream, config.yaml on file-sync, both in R2; no PVC or
    # volsync backup.
    - ../../../../components/litestream
    - ../../../../components/file-sync
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/bazarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      LITESTREAM_DB_PATH: /config/db/bazarr.db
      FILESYNC_DIR: /config
      # API key and provider credentials. The rest of /config (backups,
      # announcements, release notes) is regenerable.
      FILESYNC_FILES: config/config.yaml
      GATUS_SVC_PORT: "6767"
      GATUS_SVC_PATH: /health

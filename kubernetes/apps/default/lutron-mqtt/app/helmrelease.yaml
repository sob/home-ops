---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lutron-mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      lutron-mqtt:
        # Lutron Caseta (LEAP) <-> MQTT; source in sob/home-bridges.
        # Stateless; writes the LEAP client certs to /tmp at start.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sob/lutron-mqtt
              tag: main@sha256:77f47dea751b96c50123c8f663cf6ce9d92d8cc5ad42b78f6a261deee8b95741
            envFrom:
              - secretRef:
                  name: lutron-mqtt-secret
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /healthz, port: &health 8080 }
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /readyz, port: *health }
                  periodSeconds: 15
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 48Mi
              limits:
                memory: 128Mi
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

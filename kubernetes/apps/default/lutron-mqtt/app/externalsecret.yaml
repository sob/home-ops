---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# lutron-mqtt item (API Credential); MQTT_LUTRON_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lutron-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lutron-mqtt-secret
    template:
      engineVersion: v2
      data:
        LUTRON_HOST: "{{ .hostname }}"
        LUTRON_CREDENTIAL: "{{ .credential }}"
        MQTT_USERNAME: "{{ .MQTT_LUTRON_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_LUTRON_PASSWORD }}"
  dataFrom:
    - extract:
        key: lutron-mqtt

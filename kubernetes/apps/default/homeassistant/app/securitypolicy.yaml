---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Tinyauth forward-auth (Envoy ext-auth) for Home Assistant; access is the
# "homeassistant" entry in Tinyauth's config.
#
# This is load-bearing for authentication, not just an access gate.
#
# configuration.yaml trusts the pod CIDR via the trusted_networks auth provider
# with allow_bypass_login, so Home Assistant logs in — as the owner, with no
# password — anything that reaches its login flow from this gateway. That is
# only safe because /auth/login_flow is NOT in the app's path.allow in
# Tinyauth's config, so it cannot be reached without passing Tinyauth first.
#
# Two things must therefore stay true:
#   - failOpen stays false. Failing open here would not degrade to "ask for a
#     password", it would hand owner access to anyone who can reach the
#     gateway.
#   - path.allow in security/tinyauth/app/externalsecret.yaml keeps /auth/token
#     and /api open (the companion app needs them) while keeping
#     /auth/login_flow, /auth/authorize and /auth/providers closed.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homeassistant
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # homeassistant-app, NOT homeassistant. app-template names a route after
      # the release only when there is a single route key (adminer, sabnzbd,
      # lubelog); with more than one it suffixes the key. This app defines both
      # app and code-server, so the routes are homeassistant-app and
      # homeassistant-code-server.
      #
      # A targetRef that matches nothing is silently accepted — the policy just
      # never attaches and every request sails through unauthenticated, looking
      # exactly like forward-auth is "not working" rather than misconfigured.
      name: homeassistant-app
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - cookie
      - accept
      - user-agent
      - authorization
      - x-forwarded-for
      - x-forwarded-proto
      - x-real-ip
    http:
      backendRefs:
        - kind: Service
          name: tinyauth
          namespace: security
          port: 8082
      path: /api/auth/envoy?path=
      headersToBackend:
        - Remote-User
        - Remote-Name
        - Remote-Email
        - Remote-Groups
        - Remote-Sub

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homeassistant
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/external
    - ../../../../components/volsync
    - ../../../../components/postgresql
  dependsOn:
    # namespace is required — dependsOn defaults to this Kustomization's own
    # namespace (default, set by apps/default/kustomization.yaml) while the
    # stores live in external-secrets. Without it the dependency never resolves
    # and the Kustomization blocks forever with no obvious error.
    - name: external-secrets-stores
      namespace: external-secrets
    # Was emqx-cluster, which does not exist — only a stale HelmRepository at
    # kubernetes/flux/meta/repositories/helm/emqx.yaml survives, and it is not
    # even referenced by that directory's kustomization. This cluster's MQTT
    # broker is mosquitto, in the database namespace.
    - name: mosquitto
      namespace: database
  path: ./kubernetes/apps/default/homeassistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: hass
      # Used by HOME_ASSISTANT_TRUSTED_PROXIES. Was never defined anywhere, so
      # under non-strict postBuild it silently rendered as an empty string and
      # Home Assistant had no trusted proxies configured at all.
      CLUSTER_POD_CIDR: 10.42.0.0/16
      VOLSYNC_SCHEDULE: "30 0 * * *"
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_STORAGECLASS: ceph-block
      VOLSYNC_SNAPSHOTCLASS: csi-ceph-blockpool

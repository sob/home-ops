---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flair-mqtt
spec:
  groups:
    - name: flair-mqtt
      rules:
        - alert: FlairMqttNotReady
          # /readyz fails while MQTT or the upstream side is down.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="flair-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "flair-mqtt can't reach the Flair API or Mosquitto"
            description: "Room, vent and puck state on MQTT is stale. `kubectl -n default logs deploy/flair-mqtt` says which side is down."

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# flair-mqtt item (API Credential); MQTT_FLAIR_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flair-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: flair-mqtt-secret
    template:
      engineVersion: v2
      data:
        FLAIR_CLIENT_ID: "{{ .username }}"
        FLAIR_CLIENT_SECRET: "{{ .credential }}"
        MQTT_USERNAME: "{{ .MQTT_FLAIR_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_FLAIR_PASSWORD }}"
  dataFrom:
    - extract:
        key: flair-mqtt

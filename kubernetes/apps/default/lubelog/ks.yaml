---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lubelog
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/external
    - ../../../../components/volsync
    - ../../../../components/postgresql
  dependsOn:
    # namespace is required. dependsOn defaults to the referring Kustomization's
    # own namespace, and this one lands in default (apps/default/kustomization
    # .yaml sets namespace: default for everything it collects), while
    # external-secrets-stores lives in external-secrets. Without this the
    # dependency never resolves and the Kustomization blocks indefinitely.
    - name: external-secrets-stores
      namespace: external-secrets
  path: ./kubernetes/apps/default/lubelog/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_SCHEDULE: "18 1 * * *"
      VOLSYNC_CAPACITY: 1Gi

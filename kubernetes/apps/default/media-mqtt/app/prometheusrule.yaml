---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: media-mqtt
spec:
  groups:
    - name: media-mqtt
      rules:
        - alert: MediaMqttNotReady
          # /readyz fails while MQTT or the upstream side is down.
          expr: |
            kube_deployment_status_replicas_available{namespace="default", deployment="media-mqtt"} < 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "media-mqtt can't reach its upstream or Mosquitto"
            description: "Media events (added, grabbed, downloaded) on MQTT is stale, so Node-RED automations using it are blind. `kubectl -n default logs deploy/media-mqtt` says which side is down."

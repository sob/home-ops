---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# media-mqtt item (API Credential); MQTT_MEDIA_* custom fields are this bridge's own
# Mosquitto login (also read by database/mosquitto to create the user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-mqtt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: media-mqtt-secret
    template:
      engineVersion: v2
      data:
        WEBHOOK_TOKEN: "{{ .credential }}"
        MQTT_USERNAME: "{{ .MQTT_MEDIA_USERNAME }}"
        MQTT_PASSWORD: "{{ .MQTT_MEDIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: media-mqtt

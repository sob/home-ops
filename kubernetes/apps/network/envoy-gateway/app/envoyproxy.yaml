---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-config
  namespace: network
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # The generated LoadBalancer Service defaults to externalTrafficPolicy:
      # Local. With Cilium L2 announcement the ARP responder (lease holder) is
      # elected independently of which node runs the envoy pod and is NOT
      # endpoint-locality aware, so the announcing node frequently has no local
      # endpoint and silently drops traffic to the gateway VIP (.200/.201).
      # Cluster lets any node forward to the pod, matching the working pattern
      # used by the blocky LB service.
      envoyService:
        externalTrafficPolicy: Cluster
      # Both internal-gateway and external-gateway resolve to this single
      # EnvoyProxy via GatewayClass parametersRef, so this configures both.
      envoyDeployment:
        replicas: 2
        pod:
          # Split each gateway's replicas across failure domains (basement /
          # garage racks). Previously a single internal-gateway replica on
          # metal-02, so all internal L7 depended on one node.
          #
          # matchLabelKeys is load-bearing: both gateways' pods share
          # app.kubernetes.io/name=envoy, so without it all four pods count as
          # one group and "2 per zone" is satisfied by putting both internal
          # replicas in basement and both external in garage — constraint green,
          # per-gateway zone redundancy gone. Grouping by owning gateway makes
          # each spread independently.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Tinyauth forward-auth (Envoy ext_authz) on the echo-server route. Tinyauth's
# Envoy mode reads the host from the check request's Host (Envoy keeps the
# original) and the path from ?path=; Envoy appends the original path to
# `path`, so the check URL is /api/auth/envoy?path=/original/path. Signed-out
# browsers get a 302 to login.56kbps.io; access is the "echo" entry in
# Tinyauth's config.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: echo-server
  namespace: network
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: echo-server
  extAuth:
    failOpen: false
    recomputeRoute: true
    headersToExtAuth:
      - cookie
      - accept
      - user-agent
      - authorization
      - x-forwarded-for
      - x-forwarded-proto
      - x-real-ip
    http:
      backendRefs:
        - kind: Service
          name: tinyauth
          namespace: security
          port: 3000
      path: /api/auth/envoy?path=
      headersToBackend:
        - Remote-User
        - Remote-Name
        - Remote-Email
        - Remote-Groups
        - Remote-Sub

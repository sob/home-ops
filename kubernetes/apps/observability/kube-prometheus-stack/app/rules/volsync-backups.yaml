---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync-backups
  namespace: observability
spec:
  groups:
    - name: volsync.rules
      interval: 1m
      rules:
        # Safety net for stale restic locks. A mover killed mid-run (node
        # restart, power loss) leaves its lock in R2; the backup itself still
        # saves a snapshot, but the follow-on `forget` needs an exclusive lock
        # and fails, so the source never completes a sync and retries forever.
        # Bumping VOLSYNC_UNLOCK does NOT clear these: it runs plain
        # `restic unlock`, which can't clear a dead pod's lock (see
        # apps/default/jellyfin/ks.yaml). `task volsync:unlock` can.
        # role="source" only —
        # ReplicationDestinations use manual restore-once triggers and are
        # permanently "out of sync" by design.
        - alert: VolsyncBackupOutOfSync
          expr: |
            volsync_volume_out_of_sync{role="source"} == 1
          for: 6h
          labels:
            severity: warning
            type: infrastructure
          annotations:
            summary: "Volsync backup out of sync: {{ $labels.obj_namespace }}/{{ $labels.obj_name }}"
            description: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} has not completed a
              scheduled restic backup for 6h. Usually a stale repository lock from a
              mover killed mid-backup (check the mover logs for "repository is
              already locked"). Clear it with
              `task volsync:unlock NS={{ $labels.obj_namespace }} APP=<app>`
              (the ReplicationSource name without "-r2").

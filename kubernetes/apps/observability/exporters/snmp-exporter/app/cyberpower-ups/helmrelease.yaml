---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snmp-exporter-cyberpower-ups
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus-snmp-exporter
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    image:
      repository: quay.io/prometheus/snmp-exporter
    service:
      labels:
        snmp-exporter-cyberpower-ups: "snmp-exporter-cyberpower-ups"
    serviceMonitor:
      enabled: true
      namespace: observability
      params:
        - name: ups
          module: ["cyberpower"]
          auth: ["public_v1"]
          # RMCARD205 on the rack UPS. Literal IP: rack-ups doesn't resolve anywhere.
          target: 10.1.100.74
      path: /snmp
      scrapeTimeout: 20s
      relabelings:
        # Keep the old instance name so alerts and dashboards read "rack-ups".
        - targetLabel: instance
          replacement: rack-ups
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

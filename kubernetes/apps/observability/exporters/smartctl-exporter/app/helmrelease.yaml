---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/refs/heads/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus-smartctl-exporter
  interval: 30m
  # DaemonSet — sits at 9/10 forever because metal-08 is intentionally offline.
  # See the cilium HelmRelease for the full explanation; without disableWait
  # Helm blocks on the DaemonSet rollout and fails the release.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    config:
      devices:
        - /dev/nvme0n1
        - /dev/nvme1n1
        - /dev/nvme2n1
    resources:
      requests:
        cpu: 11m
        memory: 32Mi
    serviceMonitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (pod)
    prometheusRules:
      enabled: false

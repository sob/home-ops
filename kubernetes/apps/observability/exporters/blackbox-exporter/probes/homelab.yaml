# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/probe_v1.json
---
kind: Probe
apiVersion: monitoring.coreos.com/v1
metadata:
  name: homelab
spec:
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - doom.${SECRET_INTERNAL_DOMAIN}
        # Kubernetes nodes
        - 10.1.100.101  # metal-01
        - 10.1.100.102  # metal-02
        - 10.1.100.103  # metal-03
        - 10.1.100.104  # metal-04
        - 10.1.100.105  # metal-05
        - 10.1.100.106  # metal-06
        - 10.1.100.107  # metal-07
        # IoT devices
        - hue.${SECRET_INTERNAL_DOMAIN}        # Philips Hue bridge
        - lutron.${SECRET_INTERNAL_DOMAIN}     # Lutron Caseta hub
        # Chamberlain MyQ monitored via UniFi Poller instead (doesn't respond to ICMP)
        # Sonos devices
        - sonos-back-deck.${SECRET_INTERNAL_DOMAIN}
        - sonos-fire-pit.${SECRET_INTERNAL_DOMAIN}
        - sonos-hottub.${SECRET_INTERNAL_DOMAIN}
        - sonos-kitchen.${SECRET_INTERNAL_DOMAIN}
        - sonos-livingroom.${SECRET_INTERNAL_DOMAIN}
        - sonos-office.${SECRET_INTERNAL_DOMAIN}
        - sonos-trampoline.${SECRET_INTERNAL_DOMAIN}

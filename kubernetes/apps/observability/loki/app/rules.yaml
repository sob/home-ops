---
# Loki ruler rules — log-derived alerts evaluated against LogQL and routed to
# Alertmanager. Mounted at /etc/loki/rules/fake (tenant "fake" since auth is off).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
data:
  rules.yaml: |
    groups:
      - name: container-logs
        rules:
          - alert: ContainerHighErrorLogRate
            expr: |
              sum by (namespace, app) (
                rate({namespace=~".+"} |~ `(?i)\b(panic|fatal|unrecoverable)\b` [5m])
              ) > 5
            for: 10m
            labels:
              severity: warning
              type: workload
            annotations:
              summary: "High fatal/panic log rate in {{ $labels.namespace }}/{{ $labels.app }}"
              description: "{{ $labels.namespace }}/{{ $labels.app }} is emitting >5 fatal/panic log lines per second over 10m."
          - alert: ContainerOOMLogged
            expr: |
              sum by (namespace, app) (
                count_over_time({namespace=~".+"} |~ `(?i)out of memory|oom-kill|cannot allocate memory` [10m])
              ) > 0
            for: 1m
            labels:
              severity: warning
              type: workload
            annotations:
              summary: "Out-of-memory signature in logs for {{ $labels.namespace }}/{{ $labels.app }}"
              description: "Container logs contain OOM/allocation-failure messages in the last 10m."
          # Migrated from the Terraform/Loki Cloud rule (log-based, so it lives in
          # the ruler rather than a PrometheusRule).
          - alert: ArrDatabaseLocked
            expr: |
              sum by (app) (
                count_over_time({namespace="default"} |~ `database is locked` [10m])
              ) > 20
            for: 5m
            labels:
              severity: warning
              type: workload
            annotations:
              summary: "Arr app {{ $labels.app }} hitting 'database is locked'"
              description: ">20 'database is locked' log lines in 10m for {{ $labels.app }} — SQLite contention; consider moving to Postgres or reducing concurrency."

      - name: talos-host-logs
        rules:
          - alert: TalosKernelErrors
            expr: |
              sum by (host) (
                count_over_time({source="talos"} |~ `(?i)\b(I/O error|EXT4-fs error|XFS.*error|mce:|Hardware Error|nvme.*resetting|link is down)\b` [10m])
              ) > 0
            for: 5m
            labels:
              severity: critical
              type: infrastructure
            annotations:
              summary: "Talos host {{ $labels.host }} logged kernel/hardware errors"
              description: "Kernel I/O, filesystem, MCE or NIC-link errors seen in the last 10m on {{ $labels.host }}."
          - alert: TalosServiceRestarts
            expr: |
              sum by (host) (
                count_over_time({source="talos"} |~ `(?i)service .* failed|restarting service|task .* failed` [15m])
              ) > 3
            for: 5m
            labels:
              severity: warning
              type: infrastructure
            annotations:
              summary: "Talos services flapping on {{ $labels.host }}"
              description: "More than 3 Talos service failure/restart messages in 15m on {{ $labels.host }}."

      - name: network-syslog
        rules:
          # UniFi activity log: CEF that vector-aggregator parses into .cef
          # (`| json` exposes it as cef_name, cef_severity (0-10), cef_src, ...).
          - alert: UnifiThreatDetected
            expr: |
              sum by (cef_src, cef_dst, cef_UNIFIipsSignature) (
                count_over_time({source="unifi"} |= "|Threat Detected|" | json | cef_severity >= 7 | cef_severity < 9 [15m])
              ) > 0
            labels:
              severity: warning
              type: network
            annotations:
              summary: "UniFi IPS: {{ $labels.cef_UNIFIipsSignature }}"
              description: "UniFi IPS flagged {{ $labels.cef_src }} -> {{ $labels.cef_dst }} in the last 15m."
          - alert: UnifiThreatDetectedCritical
            expr: |
              sum by (cef_src, cef_dst, cef_UNIFIipsSignature) (
                count_over_time({source="unifi"} |= "|Threat Detected|" | json | cef_severity >= 9 [15m])
              ) > 0
            labels:
              severity: critical
              type: network
            annotations:
              summary: "UniFi IPS (high severity): {{ $labels.cef_UNIFIipsSignature }}"
              description: "UniFi IPS flagged {{ $labels.cef_src }} -> {{ $labels.cef_dst }} at CEF severity 9+ in the last 15m."
          - alert: UnifiFirewallBlockSpike
            expr: |
              sum(count_over_time({source="unifi"} |= "|Blocked by Firewall|" [15m])) > 300
            for: 15m
            labels:
              severity: warning
              type: network
            annotations:
              summary: "UniFi firewall block spike"
              description: ">300 firewall blocks per 15m for 15m (normal is ~10/hour)."
          - alert: UnifiConfigChanged
            expr: |
              sum by (cef_name, cef_UNIFIadmin, cef_UNIFIsettingsSection, cef_UNIFIsettingsEntry) (
                count_over_time({source="unifi"} |~ `\|Config (Created|Modified|Removed)\|` | json [10m])
              ) > 0
            labels:
              severity: info
              type: network
            annotations:
              summary: "UniFi {{ $labels.cef_name }}: {{ $labels.cef_UNIFIsettingsSection }} {{ $labels.cef_UNIFIsettingsEntry }}"
              description: "{{ $labels.cef_UNIFIadmin }} changed {{ $labels.cef_UNIFIsettingsSection }} / {{ $labels.cef_UNIFIsettingsEntry }} in UniFi."
          - alert: UnifiSyslogSilent
            expr: |
              absent_over_time({source="unifi"}[1h])
            for: 15m
            labels:
              severity: warning
              type: network
            annotations:
              summary: "No UniFi syslog for over an hour"
              description: "vector-aggregator has received no UniFi activity log in 1h; check the console's syslog/SIEM setting (10.1.100.210:514)."
          - alert: NetworkAuthFailures
            expr: |
              sum by (host) (
                count_over_time({source=~"unifi|synology|network"} |~ `(?i)(authentication failure|failed login|invalid user|login failed)` [10m])
              ) > 10
            for: 5m
            labels:
              severity: warning
              type: network
            annotations:
              summary: "Repeated auth failures on {{ $labels.host }}"
              description: ">10 authentication-failure log lines in 10m from {{ $labels.host }} — possible brute force."
          - alert: SynologyVolumeErrors
            expr: |
              sum by (host) (
                count_over_time({source="synology"} |~ `(?i)(volume.*(degraded|crashed)|disk.*(failed|bad sector)|smart.*(warning|error)|scrub.*error)` [15m])
              ) > 0
            for: 5m
            labels:
              severity: critical
              type: storage
            annotations:
              summary: "Synology {{ $labels.host }} logged volume/disk errors"
              description: "Volume-degraded, disk-failure, SMART or scrub errors in the last 15m on {{ $labels.host }}."
      - name: backups
        rules:
          # Upload errors from the backup sidecars: litestream (`level=ERROR`),
          # rclone in file-sync / settings-sync / enigma-bbs's backup
          # (`ERROR :`, `Failed to copy`) and enigma's own `backup of … failed`.
          # They retry (litestream every second, file-sync every minute, enigma
          # hourly), so a real outage keeps every 1h window non-empty; `for: 90m`
          # skips one-off blips. Sidecars that stop are covered by the
          # BackupSidecar* PrometheusRules.
          - alert: BackupUploadErrors
            expr: |
              sum by (namespace, app, container) (
                count_over_time({container=~"litestream|file-sync|settings-sync|backup"} |~ `level=ERROR|ERROR :|Failed to copy|backup of .* failed` [1h])
              ) > 0
            for: 90m
            labels:
              severity: critical
              type: backup
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.app }} {{ $labels.container }} can't back up to R2"
              description: "{{ $labels.container }} has logged upload errors for over 90 minutes, so {{ $labels.app }}'s copy in R2 is falling behind. Check `kubectl -n {{ $labels.namespace }} logs deploy/{{ $labels.app }} -c {{ $labels.container }}`."
      - name: plex
        rules:
          # Moved from default/plex's plex-loki-rules ConfigMap, which the ruler
          # never loaded (only this ConfigMap is mounted).
          - alert: PlexDatabaseBusy
            expr: |
              sum by (app) (count_over_time({app="plex"} |~ "(?i)retry busy DB" [2m])) > 0
            for: 2m
            labels:
              severity: critical
              type: workload
            annotations:
              summary: "Plex is retrying a busy database"
              description: "Plex Media Server logged `retry busy DB` in the last 2m: its SQLite library is contended, and playback or scans may stall."
      - name: zigbee2mqtt
        rules:
          # Moved from default/zigbee2mqtt's zigbee2mqtt-loki-rules ConfigMap,
          # which the ruler never loaded (only this ConfigMap is mounted).
          - alert: Zigbee2MQTTBrokerUnreachable
            expr: |
              sum by (app) (count_over_time({app="zigbee2mqtt"} |~ "(?i)not connected to mqtt server" [2m])) > 0
            for: 2m
            labels:
              severity: critical
              type: workload
            annotations:
              summary: "Zigbee2MQTT can't reach Mosquitto"
              description: "Zigbee2MQTT logged `Not connected to MQTT server` in the last 2m: Zigbee devices still talk to the coordinator, but no state reaches MQTT and Node-RED automations can't act on them."

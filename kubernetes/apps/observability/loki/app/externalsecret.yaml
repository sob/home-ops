---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: loki-secret
    template:
      engineVersion: v2
      data:
        # Loki's own R2 token (`loki` item), with Object Read & Write on
        # stone-loki-logs only. The shared `cloudflare` key is scoped to
        # stone-volsync, so with it every R2 call returned 403.
        # Loki expands these at runtime via -config.expand-env=true.
        AWS_ACCESS_KEY_ID: "{{ .CLOUDFLARE_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .CLOUDFLARE_SECRET_ACCESS_KEY }}"
        R2_ENDPOINT: "{{ .CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  dataFrom:
    - extract:
        key: loki

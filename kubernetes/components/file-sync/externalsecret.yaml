---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# rclone remote "r2", configured from env. Same R2 bucket and key as volsync and
# litestream (REPOSITORY_TEMPLATE is "s3:https://<acct>.r2.cloudflarestorage.com/stone-volsync").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-file-sync"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: "${APP}-file-sync-secret"
    template:
      engineVersion: v2
      data:
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ENDPOINT: '{{ .REPOSITORY_TEMPLATE | trimPrefix "s3:" | trimSuffix "/stone-volsync" }}'
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
  dataFrom:
    - extract:
        key: cloudflare
    - extract:
        key: volsync-r2-template

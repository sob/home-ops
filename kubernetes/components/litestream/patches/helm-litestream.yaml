---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: required-for-kustomize-but-not-used
spec:
  values:
    controllers:
      main:
        initContainers:
          litestream-restore:
            image: &image
              repository: docker.io/litestream/litestream
              tag: 0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                DB=${LITESTREAM_DB_PATH}
                litestream restore -config /etc/litestream.yml -if-db-not-exists -if-replica-exists "$DB"
                # Only with the litestream-seed component mounted: first run, no
                # replica in R2 yet, so copy the DB from the app's old PVC.
                # .backup reads through the WAL, unlike a file copy.
                # LITESTREAM_SEED is the DB's path inside that PVC when it isn't
                # at the root (e.g. db/bazarr.db).
                SEED_REL="${LITESTREAM_SEED:-}"
                [ -n "$SEED_REL" ] || SEED_REL=$(basename "$DB")
                SEED="/seed/$SEED_REL"
                if [ ! -f "$DB" ] && [ -f "$SEED" ]; then
                  echo "no replica found; seeding from $SEED"
                  sqlite3 "$SEED" ".backup '$DB'"
                fi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          litestream:
            dependsOn: litestream-restore
            image: *image
            # Litestream holds a read transaction for as long as it runs, so an
            # app that forces a TRUNCATE checkpoint at startup (qui) times out
            # and crash-loops. With LITESTREAM_WAIT_PORT set, start replicating
            # only once the app listens on that port, and stop when it goes
            # away so a restarted app can checkpoint again. Script variables
            # are $var, not ${var}, so Flux postBuild leaves them alone.
            command: ["/bin/bash", "-c"]
            args:
              - |
                port=${LITESTREAM_WAIT_PORT:=}
                [ -n "$port" ] || exec litestream replicate -config /etc/litestream.yml
                up() { timeout 2 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; }
                until up; do sleep 2; done
                litestream replicate -config /etc/litestream.yml &
                pid=$!
                trap 'kill -TERM $pid; wait $pid; exit' TERM INT
                while sleep 5; do
                  kill -0 $pid 2>/dev/null || break
                  if ! up; then
                    echo "app stopped listening on $port; releasing the database"
                    kill -TERM $pid
                    break
                  fi
                done
                wait $pid
            restartPolicy: Always
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    persistence:
      litestream-config:
        type: secret
        name: ${APP}-litestream-secret
        advancedMounts:
          main:
            litestream-restore: &config
              - path: /etc/litestream.yml
                subPath: litestream.yml
                readOnly: true
            litestream: *config

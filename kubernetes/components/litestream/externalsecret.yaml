---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-litestream"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: "${APP}-litestream-secret"
    template:
      engineVersion: v2
      data:
        # Rendered whole here rather than via litestream's $VAR expansion, which
        # would collide with Flux postBuild substitution. Same R2 bucket and key
        # as volsync (REPOSITORY_TEMPLATE is
        # "s3:https://<acct>.r2.cloudflarestorage.com/stone-volsync").
        #
        # Every L0 retention check and compaction lists the whole level from the
        # start, and each 1,000-key page is an R2 Class A operation. The defaults
        # (15s check, L1 every 30s) ran up $4-5 a day of them across our
        # databases, so check and compact less often. WAL changes still upload
        # within a second, so a restore loses no more data than before.
        litestream.yml: |
          l0-retention-check-interval: 5m
          levels:
            - interval: 5m
            - interval: 1h
            - interval: 6h
          dbs:
            - path: ${LITESTREAM_DB_PATH}
              replica:
                type: s3
                bucket: stone-volsync
                path: litestream/${APP}
                endpoint: {{ .REPOSITORY_TEMPLATE | trimPrefix "s3:" | trimSuffix "/stone-volsync" }}
                region: auto
                force-path-style: true
                access-key-id: {{ .AWS_ACCESS_KEY_ID }}
                secret-access-key: {{ .AWS_SECRET_ACCESS_KEY }}
  dataFrom:
    - extract:
        key: cloudflare
    - extract:
        key: volsync-r2-template

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      # Is the app itself alive? Probed in-cluster over the ClusterIP, which
      # bypasses the gateway and Tinyauth entirely. The path is the app's own
      # liveness-probe path, so it is guaranteed unauthenticated.
      - name: "${APP}"
        group: guarded
        url: "http://${GATUS_SVC:-${APP}}.${GATUS_SVC_NS:-default}.svc.cluster.local:${GATUS_SVC_PORT:-80}${GATUS_SVC_PATH:-/}"
        interval: 1m
        ui:
          hide-hostname: false
          hide-url: false
        conditions:
          - "[STATUS] == ${GATUS_STATUS:-200}"
        alerts:
          - type: pushover
      # Is the public path still fronted by Tinyauth? Tinyauth answers
      # non-browser clients (gatus included) with 401 rather than a 302 to the
      # login page, so 401 here proves gateway + ext-auth + Tinyauth without
      # pretending to prove the app. follow-redirects stays off so a 302 to
      # some login page can never pass as healthy.
      - name: "${APP}-edge"
        group: edge
        url: "https://${GATUS_SUBDOMAIN:-${APP}}.${GATUS_DOMAIN:-${SECRET_DOMAIN}}${GATUS_PATH:-/}"
        interval: 5m
        ui:
          hide-hostname: false
          hide-url: false
        client:
          dns-resolver: tcp://10.1.0.1:53
          follow-redirects: false
        conditions:
          - "[STATUS] == ${GATUS_EDGE_STATUS:-401}"
        alerts:
          - type: pushover
